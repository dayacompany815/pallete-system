<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출고지기 층별 QR코드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#1a1a1a;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  /* 툴바 */
  .toolbar{
    position:fixed;top:0;left:0;right:0;z-index:99;
    background:#111;border-bottom:1px solid #333;
    padding:12px 24px;display:flex;align-items:center;gap:12px;
  }
  .toolbar span{color:#aaa;font-size:14px;}
  .toolbar button{
    background:#03C75A;color:#fff;border:0;
    padding:8px 20px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .toolbar button.sec{background:#333;}

  /* 각 층 페이지 — 화면 100vh */
  .floor-page{
    width:100vw;height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
    page-break-after:always; break-after:page;
  }
  .floor-page:last-child{page-break-after:auto;break-after:auto;}

  /* 배경 대형 층 텍스트 */
  .floor-page .bg-label{
    position:absolute;
    font-size:45vw;font-weight:900;opacity:.04;
    color:#fff;pointer-events:none;user-select:none;
    letter-spacing:-10px;line-height:1;
    top:50%;left:50%;transform:translate(-50%,-50%);
    white-space:nowrap;
  }

  /* 카드 */
  .card{
    position:relative;z-index:1;
    background:#fff;border-radius:32px;
    padding:52px 56px 44px;
    display:flex;flex-direction:column;align-items:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    border-top:12px solid #03C75A;
    min-width:380px;
  }

  /* 층별 색상 */
  .fp-B1 .card{border-color:#7b5cff;} .fp-B1 .bg-label{color:#7b5cff;}
  .fp-1F .card{border-color:#03C75A;} .fp-1F .bg-label{color:#03C75A;}
  .fp-3F .card{border-color:#2d6cdf;} .fp-3F .bg-label{color:#2d6cdf;}
  .fp-4F .card{border-color:#f5a623;} .fp-4F .bg-label{color:#f5a623;}
  .fp-5F .card{border-color:#e0457b;} .fp-5F .bg-label{color:#e0457b;}

  .badge{
    font-size:12px;font-weight:800;color:#fff;
    padding:5px 18px;border-radius:40px;
    background:#03C75A;margin-bottom:20px;letter-spacing:.5px;
  }
  .fp-B1 .badge{background:#7b5cff;}
  .fp-3F .badge{background:#2d6cdf;}
  .fp-4F .badge{background:#f5a623;color:#000;}
  .fp-5F .badge{background:#e0457b;}

  .floor-label{
    font-size:72px;font-weight:900;letter-spacing:-2px;
    margin-bottom:6px;color:#03C75A;
  }
  .fp-B1 .floor-label{color:#7b5cff;}
  .fp-3F .floor-label{color:#2d6cdf;}
  .fp-4F .floor-label{color:#f5a623;}
  .fp-5F .floor-label{color:#e0457b;}

  .floor-name{
    font-size:20px;font-weight:700;color:#667;
    margin-bottom:32px;
  }

  .qr-wrap{
    width:280px;height:280px;
    background:#fff;border-radius:20px;
    border:3px solid #e5e8eb;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:28px;
    padding:8px;
  }
  .qr-wrap canvas,.qr-wrap img{width:260px!important;height:260px!important;}

  .desc{
    text-align:center;font-size:15px;color:#667;
    line-height:1.7;
  }
  .desc b{color:#1a1a1a;font-size:17px;display:block;margin-bottom:4px;}

  .brand{
    position:absolute;bottom:28px;
    font-size:13px;color:#555;letter-spacing:.3px;
    z-index:1;
  }

  /* 인쇄 */
  @page{size:A4;margin:0;}
  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .floor-page{height:100vh;page-break-after:always;break-after:page;}
    .floor-page:last-child{page-break-after:auto;}
    .bg-label{display:none;}
    .card{
      box-shadow:none;
      padding:40px 48px 36px;
      border-radius:24px;
    }
    .floor-label{font-size:60px;}
    .qr-wrap{width:260px;height:260px;}
    .qr-wrap canvas,.qr-wrap img{width:240px!important;height:240px!important;}
  }
</style>
</head>
<body>

<div class="toolbar noprint">
  <span>📦 출고지기 층별 QR코드</span>
  <button onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
  <button class="sec" onclick="scrollNext()">다음 층 ↓</button>
</div>

<div id="pages" style="padding-top:0;"></div>

<script>
var BASE = 'https://dayacompany815.github.io/pallete-system/worker.html';
var FB_URL = 'https://pallete-system-default-rtdb.asia-southeast1.firebasedatabase.app';

var DEFAULT_FLOORS = [
  {id:'B1', name:'지하1층', color:'#7b5cff'},
  {id:'1F', name:'1층', color:'#03C75A'},
  {id:'3F', name:'3층', color:'#2d6cdf'},
  {id:'4F', name:'4층', color:'#f5a623'},
  {id:'5F', name:'5층', color:'#e0457b'}
];

var pages = document.getElementById('pages');
var pageEls = [];

function normalizeFloorId(id){return String(id||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');}
function normalizeFloors(floors){
  var palette=['#7b5cff','#03C75A','#2d6cdf','#f5a623','#e0457b','#ff6b9d','#06b6d4','#84cc16'];
  var src=Array.isArray(floors)&&floors.length?floors:DEFAULT_FLOORS;
  var seen={}, out=[];
  src.forEach(function(f,i){
    var id=normalizeFloorId(f&&f.id);
    if(!id||seen[id])return;
    seen[id]=true;
    out.push({id:id,name:String((f&&f.name)||id).trim()||id,color:String((f&&f.color)||palette[i%palette.length]).trim()||palette[i%palette.length]});
  });
  return out.length?out:DEFAULT_FLOORS.map(function(f){return Object.assign({},f);});
}

function renderFloors(floors){
pages.innerHTML='';
pageEls=[];
normalizeFloors(floors).forEach(function(fl, idx){
  var url = BASE + '?qr=1&floor=' + fl.id;

  var page = document.createElement('div');
  page.className = 'floor-page fp-' + fl.id;
  pageEls.push(page);

  // 배경 대형 텍스트
  var bg = document.createElement('div');
  bg.className = 'bg-label';
  bg.textContent = fl.id;
  bg.style.color = fl.color;
  page.appendChild(bg);

  // 브랜드
  var brand = document.createElement('div');
  brand.className = 'brand';
  brand.textContent = '📦 출고지기 · DAYA COMPANY';
  page.appendChild(brand);

  // 카드
  var card = document.createElement('div');
  card.className = 'card';
  card.style.borderColor = fl.color;

  var badge = document.createElement('div');
  badge.className = 'badge';
  badge.textContent = '출고지기 작업 · QR 접속';
  badge.style.background = fl.color;
  if(fl.color.toLowerCase()==='#f5a623'||fl.color.toLowerCase()==='#ffd600') badge.style.color = '#000';

  var flabel = document.createElement('div');
  flabel.className = 'floor-label';
  flabel.textContent = fl.id;
  flabel.style.color = fl.color;

  var fname = document.createElement('div');
  fname.className = 'floor-name';
  fname.textContent = fl.name + ' 전용';

  var wrap = document.createElement('div');
  wrap.className = 'qr-wrap';
  var qrDiv = document.createElement('div');
  wrap.appendChild(qrDiv);

  var desc = document.createElement('div');
  desc.className = 'desc';
  desc.innerHTML = '<b>QR 스캔 → 바로 입장</b>' + fl.name + ' 파레트 입력 · 출고 전용';

  card.appendChild(badge);
  card.appendChild(flabel);
  card.appendChild(fname);
  card.appendChild(wrap);
  card.appendChild(desc);
  page.appendChild(card);
  pages.appendChild(page);

  new QRCode(qrDiv, {
    text: url,
    width: 260,
    height: 260,
    colorDark: '#1a1a1a',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
});
}

fetch(FB_URL + '/config/floors.json?t=' + Date.now())
  .then(function(r){return r.json();})
  .then(function(floors){renderFloors(floors);})
  .catch(function(){renderFloors(DEFAULT_FLOORS);});

var curPage = 0;
function scrollNext(){
  curPage = (curPage + 1) % pageEls.length;
  pageEls[curPage].scrollIntoView({behavior:'smooth'});
}

// 키보드 방향키로 페이지 이동
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowRight') scrollNext();
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){
    curPage = (curPage - 1 + pageEls.length) % pageEls.length;
    pageEls[curPage].scrollIntoView({behavior:'smooth'});
  }
});
</script>
</body>
</html>
