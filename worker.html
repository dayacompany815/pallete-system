<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>파레트 관리 시스템</title>
<link rel="apple-touch-icon" href="icon-worker.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="파레트 작업">
<link rel="manifest" href="manifest-worker.json">
<style>
:root{--bg:#F2F4F6;--card:#FFFFFF;--card2:#F9FAFB;--border:#E5E8EB;--text:#1A1A1A;--muted:#8C9EAA;--a1:#03C75A;--a2:#FF6B00;--a3:#00B900;--a4:#5046E5;--a5:#FFA800;--a6:#FF4F8B;--red:#FF3D3D;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

/* 로그인 */
#loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;background:linear-gradient(180deg,#E8F5EC 0%,#F2F4F6 100%);}
.logo{margin-bottom:10px;display:flex;justify-content:center;}
.logo img{width:90px;height:90px;border-radius:12px;filter:drop-shadow(0 0 12px rgba(3,199,90,.3));}
.login-title{font-size:20px;font-weight:900;color:var(--text);margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:28px;}
.login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 16px;}
.step-bar{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.step-dot{width:26px;height:4px;border-radius:2px;background:var(--border);}
.step-dot.done{background:var(--a3);}
.step-dot.active{background:var(--a1);}
.step-lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;}
.step-lbl b{color:var(--a1);}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.name-btn{background:var(--card2);border:1.5px solid var(--border);border-radius:11px;padding:12px 6px;font-family:inherit;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;text-align:center;}
.name-btn.sel{background:rgba(3,199,90,.08);border-color:var(--a1);color:var(--a1);}
.floor-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.floor-btn2{flex:1;min-width:56px;background:var(--card2);border:1.5px solid var(--border);border-radius:9px;padding:9px 4px;font-family:inherit;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;text-align:center;}
.floor-btn2.sel{border-color:var(--a1);color:var(--a1);background:rgba(3,199,90,.08);}
.floor-btn2.disabled{opacity:.3;cursor:default;}
.fsub{font-size:9px;margin-top:2px;}
.pw-wrap{position:relative;margin-bottom:6px;}
.pw-inp{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;font-weight:800;padding:12px 44px 12px 14px;outline:none;font-family:inherit;letter-spacing:4px;text-align:center;-webkit-appearance:none;}
.pw-inp:focus{border-color:var(--a1);}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;}
.pw-err{font-size:11px;color:var(--red);text-align:center;height:16px;margin-bottom:8px;}
.login-sum{background:rgba(3,199,90,.07);border:1px solid rgba(3,199,90,.2);border-radius:9px;padding:8px 11px;margin-bottom:11px;display:flex;align-items:center;gap:8px;font-size:13px;}
.login-btn{width:100%;background:linear-gradient(135deg,var(--a1),#029a46);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.login-btn:disabled{opacity:.4;cursor:not-allowed;}
.back-btn{width:100%;background:transparent;border:1.5px solid var(--border);border-radius:10px;padding:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;margin-top:7px;}

/* 앱 */
#appScreen{display:none;padding-bottom:64px;}
.hdr{position:sticky;top:0;z-index:200;background:#FFFFFF;border-bottom:2px solid var(--a1);padding:9px 13px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:14px;font-weight:900;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-sub{font-size:9px;color:var(--muted);margin-top:1px;}
.hdr-r{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.live{width:7px;height:7px;border-radius:50%;background:var(--a3);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-time{font-size:10px;color:var(--muted);}
.logout-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);border-radius:6px;padding:4px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;}

.floor-bar{background:var(--card2);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:6px;overflow-x:auto;}
.floor-bar::-webkit-scrollbar{display:none;}
.floor-lbl{font-size:10px;color:var(--muted);font-weight:700;flex-shrink:0;}
.flr-btn{flex-shrink:0;border:1.5px solid var(--border);background:var(--card2);color:var(--muted);border-radius:16px;padding:4px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
.flr-btn.active{background:var(--a1);border-color:var(--a1);color:#fff;}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#FFFFFF;border-top:1px solid var(--border);display:flex;box-shadow:0 -1px 6px rgba(0,0,0,.06);}
.bnav-btn{flex:1;border:none;background:transparent;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;padding:7px 4px 9px;gap:2px;color:var(--muted);position:relative;}
.bnav-btn.active{color:var(--a1);}
.bnav-icon{font-size:18px;}
.bnav-label{font-size:10px;font-weight:700;}
.bnav-badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;font-size:9px;font-weight:900;display:none;}

.page{display:none;padding:10px;}
.page.active{display:block;}
.page-lbl{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:9px;}

/* 입력 */
.ic{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:9px;}
.ic-h{padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
.ic-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ic-title{font-size:13px;font-weight:800;flex:1;}
.ic-b{padding:10px;}
.plt-no-row{display:flex;align-items:center;gap:8px;}
.plt-no-lbl{font-size:12px;color:var(--muted);font-weight:700;flex-shrink:0;}
.plt-no-disp{background:var(--card2);border:1.5px solid var(--a5);border-radius:8px;color:var(--a5);font-size:20px;font-weight:900;padding:7px 14px;min-width:60px;text-align:center;}
.c-chip{border:1.5px solid var(--border);border-radius:20px;padding:5px 11px;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);background:var(--card2);cursor:pointer;display:flex;align-items:center;gap:4px;}
.c-chip.sel{color:#fff;}
.courier-row{display:flex;flex-wrap:wrap;gap:6px;}
.pharma-row{display:flex;align-items:center;gap:7px;background:var(--card2);border-radius:8px;padding:7px 9px;margin-bottom:5px;}
.pharma-row:last-child{margin-bottom:0;}
.ph-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ph-name{font-size:12px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.box-inp{background:var(--bg);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-size:16px;font-weight:800;padding:6px 7px;outline:none;font-family:inherit;text-align:center;width:62px;-webkit-appearance:none;}
.box-inp:focus{border-color:var(--a1);}
.box-inp.hv{border-color:var(--a3);color:var(--a3);}
.box-unit{font-size:10px;color:var(--muted);flex-shrink:0;}
.approve-btn{width:100%;background:linear-gradient(135deg,var(--a3),#16a34a);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:10px;}

/* 파레트 카드 */
.plt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:7px;padding:2px 0 10px;}
.plt-card{background:var(--card);border:2px solid var(--border);border-radius:11px;overflow:hidden;cursor:pointer;position:relative;}
.plt-card.sel{border-color:var(--a5);box-shadow:0 0 0 3px rgba(255,214,0,.2);}
.plt-card-top{padding:6px 7px 3px;display:flex;align-items:center;justify-content:space-between;gap:4px;}
.plt-no-tag{background:var(--a5);color:#000;border-radius:5px;padding:2px 6px;font-size:12px;font-weight:900;flex-shrink:0;}
.plt-c-tag{font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plt-edit-btn{background:rgba(3,199,90,.12);border:1px solid rgba(3,199,90,.3);color:var(--a1);border-radius:5px;padding:2px 5px;font-size:10px;cursor:pointer;flex-shrink:0;}
.plt-del-btn{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.22);color:var(--red);border-radius:5px;padding:2px 5px;font-size:10px;cursor:pointer;flex-shrink:0;}
.plt-visual{padding:4px 7px;display:flex;justify-content:center;}
.plt-bot{padding:3px 7px 7px;}
.plt-tot{font-size:13px;font-weight:900;}
.plt-detail{font-size:10px;font-weight:600;line-height:1.6;margin-top:2px;}
.plt-chk{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:var(--a5);display:none;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#000;}
.plt-card.sel .plt-chk{display:flex;}

.sel-bar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.sel-lbl{font-size:11px;color:var(--muted);font-weight:700;}
.sel-cnt{font-size:15px;font-weight:900;color:var(--a5);}
.sel-all-btn{background:rgba(255,168,0,.1);border:1px solid rgba(255,168,0,.28);color:var(--a5);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.action-area{padding:4px 0 8px;}
.send-btn{width:100%;background:linear-gradient(135deg,var(--a1),#029a46);color:#fff;border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
.send-btn:disabled{opacity:.35;cursor:not-allowed;}

/* 전층현황 */
.all-floor-sec{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;}
.afs-hdr{padding:9px 13px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.afs-badge{padding:3px 10px;border-radius:7px;font-size:12px;font-weight:900;color:#fff;flex-shrink:0;}
.afs-mine{font-size:10px;color:var(--a3);font-weight:700;}
.afs-cnt{font-size:12px;font-weight:700;margin-left:auto;}
.afs-body{padding:8px;}
.afs-empty{text-align:center;padding:14px;color:var(--muted);font-size:12px;}
.all-plt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:5px;}
.ro-card{background:var(--card2);border-radius:8px;padding:7px 8px;}
.ro-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.ro-no{background:var(--a5);color:#000;border-radius:4px;padding:1px 5px;font-size:11px;font-weight:900;}
.ro-c{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;}
.ro-box{font-size:12px;font-weight:900;margin-bottom:3px;}
.ro-item{font-size:10px;font-weight:600;line-height:1.6;}
.ro-item-box{color:var(--muted);font-size:9px;}
.done-chip{font-size:10px;font-weight:800;color:var(--a3);background:rgba(46,204,113,.12);border-radius:5px;padding:2px 7px;}

/* 팝업 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:500;display:none;align-items:center;justify-content:center;padding:18px;}
.overlay.show{display:flex;}
.popup{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px 18px;width:100%;max-width:340px;}
.pop-icon{font-size:36px;text-align:center;margin-bottom:8px;}
.pop-title{font-size:16px;font-weight:900;text-align:center;margin-bottom:6px;}
.pop-sub{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin-bottom:16px;white-space:pre-line;}
.pop-btns{display:flex;flex-direction:column;gap:7px;}
.pop-btn{width:100%;border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
.pop-confirm{background:linear-gradient(135deg,var(--a4),#7c3aed);color:#fff;}
.pop-cancel{background:var(--card2);color:var(--text);border:1.5px solid var(--border);}

/* 보고서 */
.report-pop{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:82vh;overflow-y:auto;}
.rp-title{font-size:15px;font-weight:900;text-align:center;margin-bottom:12px;}
.rp-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:11px;}
.rp-table th{background:var(--card2);color:var(--muted);font-weight:700;padding:6px 7px;text-align:left;border:1px solid var(--border);}
.rp-table td{padding:6px 7px;border:1px solid var(--border);}
.rp-table tfoot td{background:var(--card2);font-weight:800;font-size:12px;}
.rp-btns{display:flex;flex-direction:column;gap:7px;}
.rp-btn{width:100%;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
.rp-print{background:linear-gradient(135deg,var(--a1),#029a46);color:#fff;}
.rp-csv{background:linear-gradient(135deg,var(--a3),#16a34a);color:#fff;}
.rp-close{background:var(--card2);color:var(--text);border:1.5px solid var(--border);}

.empty{text-align:center;padding:36px 16px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:8px;}

.float-approve{
  position:fixed;
  right:16px;
  bottom:80px;
  z-index:300;
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--a3),#007700);
  color:#fff;
  border:none;
  font-size:26px;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(0,185,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  transition:transform .15s;
}
.float-approve:active{transform:scale(.92);}
.float-approve.show{display:flex;}
.float-approve-label{
  position:fixed;
  right:14px;
  bottom:144px;
  z-index:300;
  background:rgba(0,185,0,.1);
  border:1px solid rgba(0,185,0,.25);
  color:var(--a3);
  border-radius:8px;
  padding:3px 8px;
  font-size:10px;
  font-weight:700;
  display:none;
}
.float-approve.show ~ .float-approve-label{display:block;}
/* 각 제약사 행 승인 버튼 */
.ph-approve{
  background:rgba(0,185,0,.08);
  border:1.5px solid rgba(0,185,0,.25);
  color:var(--a3);
  border-radius:7px;
  padding:5px 8px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  font-family:inherit;
  flex-shrink:0;
  white-space:nowrap;
}
.ph-approve:active{background:rgba(0,185,0,.2);}

#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);border:2px solid rgba(0,185,0,.4);border-radius:13px;padding:13px 22px;font-size:14px;font-weight:800;z-index:9999;opacity:0;transition:opacity .28s;pointer-events:none;text-align:center;white-space:pre-line;color:var(--a3);box-shadow:0 4px 20px rgba(0,0,0,.12);}
#toast.show{opacity:1;}
#toast.err{border-color:rgba(239,68,68,.5);color:var(--red);}

@media print{body>*{display:none!important;}#printArea{display:block!important;font-family:sans-serif;padding:18px;}#printArea h2{text-align:center;font-size:18px;margin-bottom:4px;}#printArea .pi{text-align:center;font-size:11px;color:#666;margin-bottom:14px;}#printArea table{width:100%;border-collapse:collapse;}#printArea th,#printArea td{border:1px solid #ccc;padding:5px 7px;font-size:11px;}#printArea th{background:#eee;font-weight:700;}#printArea tfoot td{background:#e8f5e9;font-weight:800;}}
#printArea{display:none;}
</style>
</head>
<body>

<!-- 로그인 -->

function getTodayStr(){
  var d=new Date();
  var days=['일','월','화','수','목','금','토'];
  var month=d.getMonth()+1;
  var date=d.getDate();
  var day=days[d.getDay()];
  return month+'월 '+date+'일 ('+day+')';
}

/* ── 일일 초기화 (Firebase 사용량 최소화) ── */
function getDayKey(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function checkDailyReset(){
  var today = getDayKey();
  var lastDay = lsGet('plt_last_day');
  if(lastDay && lastDay !== today){
    // 날짜가 바뀜 → 자동 보관 후 초기화
    archiveAndReset(lastDay, true);
  } else if(!lastDay) {
    lsSet('plt_last_day', today);
  }
}

async function archiveAndReset(archiveDate, auto){
  try {
    // Firebase에 날짜별 보관 (최소 데이터만)
    var archiveDate2 = archiveDate || getDayKey();
    var summary = buildDailySummary();
    // 용량 최소화: 상세 파레트 데이터 제외, 집계만 저장
    await fetch(FB_URL+'/history/'+archiveDate2+'.json', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(summary)
    });
  } catch(e) {}

  // 로컬 초기화
  waiting={};done={};doneStatus={};
  ALL_FLOORS.forEach(function(f){waiting[f]=[];done[f]=[];});
  saveState();
  lsSet('plt_last_day', getDayKey());

  if(!auto) {
    showToast('✅ 일일 마감 완료\n데이터가 보관됐습니다');
    renderWaiting(); renderAllFloors(); updateBadges(); updatePltNo();
  }

  // Firebase 초기화 (waiting만)
  try {
    var emptyWaiting = {data:{}, updatedAt:new Date().toISOString(), doneStatus:{}};
    ALL_FLOORS.forEach(function(f){ emptyWaiting.data[f]=[]; });
    await fetch(FB_URL+'/waiting.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(emptyWaiting)});
    await fetch(FB_URL+'/shipments.json',{method:'DELETE'});
    await fetch(FB_URL+'/notifications.json',{method:'DELETE'});
  } catch(e) {}
}

function buildDailySummary(){
  // 집계 데이터만 (용량 최소화)
  var totalPlt=0, totalBox=0;
  var byFloor={}, byCourier={};
  ALL_FLOORS.forEach(function(f){
    var wl=waiting[f]||[], dl=done[f]||[];
    var all=wl.concat(dl);
    byFloor[f]={plt:all.length, box:all.reduce(function(s,p){return s+p.totalBox;},0), done:doneStatus[f]||false};
    all.forEach(function(p){
      if(!byCourier[p.courierId]) byCourier[p.courierId]={plt:0,box:0};
      byCourier[p.courierId].plt++; byCourier[p.courierId].box+=p.totalBox||0;
      totalPlt++; totalBox+=p.totalBox||0;
    });
  });
  return {date:getDayKey(), savedAt:new Date().toISOString(), totalPlt:totalPlt, totalBox:totalBox, byFloor:byFloor, byCourier:byCourier};
}

function manualDailyReset(){
  if(!confirm('오늘 업무를 마감하고 새 작업을 시작할까요?\n\n현재 데이터가 보관됩니다.')) return;
  archiveAndReset(getDayKey(), false);
}


/* ════ 직책별 권한 ════ */
var ROLES = {
  '사원':   {canEdit:false, canDelete:false, canDailyReset:false, tabs:['input','waiting']},
  '부팀장': {canEdit:true,  canDelete:true,  canDailyReset:true,  tabs:['input','waiting','expect','output']},

};

function getMyRole(){
  var worker=null;
  for(var i=0;i<cfg.workers.length;i++){if(cfg.workers[i].name===session.name){worker=cfg.workers[i];break;}}
  return worker&&worker.role?worker.role:'사원';
}

function getMyWorker(){
  for(var i=0;i<cfg.workers.length;i++){if(cfg.workers[i].name===session.name)return cfg.workers[i];}
  return null;
}

function canDo(action){
  var worker=getMyWorker();
  var role=worker&&worker.role?worker.role:'사원';
  // 세부 권한이 있으면 우선 적용
  if(worker&&worker.perms&&worker.perms[action]!==undefined){
    return !!worker.perms[action];
  }
  // 없으면 직책 기본값
  var perm=ROLES[role]||ROLES['사원'];
  return !!perm[action];
}

function applyRoleUI(){
  var role=getMyRole();
  var perm=ROLES[role]||ROLES['사원'];

  // 직책 배지 표시
  var roleBadge=document.getElementById('roleBadge');
  if(roleBadge){
    var roleColors={'사원':'#5a7a99','부팀장':'#f97316','팀장':'#2ecc71'};
    roleBadge.textContent=role;
    roleBadge.style.background=(roleColors[role]||'#555')+'33';
    roleBadge.style.color=roleColors[role]||'#fff';
    roleBadge.style.borderColor=(roleColors[role]||'#555')+'66';
  }

  // 탭 권한 적용 - perms 우선, 없으면 직책 기본값
  var worker2=getMyWorker();
  var tabMap={
    'input':   true,                // 항상 허용
    'waiting': true,                // 항상 허용
    'expect':  canDo('canExpect'),
    'output':  canDo('canOutput')
  };
  ['input','waiting','expect','output'].forEach(function(t){
    var btn=document.getElementById('bn-'+t);
    if(!btn) return;
    btn.style.display=tabMap[t]?'':'none';
  });

  // 일일마감 버튼 권한
  var resetBtn=document.getElementById('dailyResetBtn');
  if(resetBtn) resetBtn.style.display=perm.canDailyReset?'':'none';

  // 사원이면 첫 탭을 input으로 고정
  if(perm.tabs.indexOf(currentTab)<0){
    goTab(perm.tabs[0]);
  }
}

var session = {name:'',floor:'',loggedIn:false};
var selName = '', selFloor = '';
var currentFloor = '', currentTab = 'input', inputCourier = 'koryo';
var waiting = {}, done = {}, doneStatus = {};
var wSel = {};
var _report = null;

/* 스토리지 */
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

/* 설정 로드 */
function loadCfg(){
  var s = lsGet('plt_cfg');
  if(!s) return;
  try {
    var c = JSON.parse(s);
    if(c.workers && c.workers.length > 0) cfg.workers = c.workers;
    if(c.floorPw) cfg.floorPw = c.floorPw;
    if(c.pharmas && c.pharmas.length > 0) cfg.pharmas = c.pharmas;
    if(c.couriers && c.couriers.length > 0) cfg.couriers = c.couriers;
    if(c.floorSettings) cfg.floorSettings = c.floorSettings;
  } catch(e) {}
}

/* 상태 저장/로드 */
function saveState(){
  try {
    lsSet('plt_state', JSON.stringify({waiting:waiting, done:done, doneStatus:doneStatus}));
  } catch(e) {}
}
function loadState(){
  var s = lsGet('plt_state');
  if(s) {
    try {
      var d = JSON.parse(s);
      waiting = d.waiting || {};
      done = d.done || {};
      doneStatus = d.doneStatus || {};
    } catch(e) {}
  }
  ALL_FLOORS.forEach(function(f){
    if(!waiting[f]) waiting[f] = [];
    if(!done[f]) done[f] = [];
  });
}

/* 토스트 */
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type === 'err' ? 'show err' : 'show';
  setTimeout(function(){ t.className = ''; }, 2200);
}

/* 오버레이 */
function showOverlay(id){ document.getElementById(id).classList.add('show'); }
function hideOverlay(id){ document.getElementById(id).classList.remove('show'); }

/* 시계 */
function startClock(){
  setInterval(function(){
    var n = new Date();
    var el = document.getElementById('hdrTime');
    if(el) el.textContent = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  }, 1000);
}

/* ===== 로그인 ===== */
function setStep(n){
  document.getElementById('step1').style.display = n===1 ? '' : 'none';
  document.getElementById('step2').style.display = n===2 ? '' : 'none';
  document.getElementById('step3').style.display = n===3 ? '' : 'none';
  ['sd1','sd2','sd3'].forEach(function(id,i){
    var el = document.getElementById(id);
    el.className = 'step-dot' + (i+1 < n ? ' done' : i+1 === n ? ' active' : '');
  });
}

function renderNameGrid(){
  loadCfg();
  var g = document.getElementById('nameGrid');
  g.innerHTML = '';
  if(!cfg.workers || cfg.workers.length === 0){
    var d = document.createElement('div');
    d.style.cssText = 'grid-column:1/-1;text-align:center;padding:20px;color:#5a7a99;font-size:13px;';
    d.textContent = '등록된 작업자가 없습니다';
    g.appendChild(d);
    return;
  }
  cfg.workers.forEach(function(w){
    var btn = document.createElement('button');
    btn.className = 'name-btn' + (selName === w.name ? ' sel' : '');
    if(selName === w.name){
      btn.style.borderColor = w.color || '#3b9eff';
      btn.style.color = w.color || '#3b9eff';
    }
    var iconEl = document.createElement('div');
    iconEl.style.cssText = 'font-size:22px;margin-bottom:4px;';
    iconEl.textContent = w.icon || '👤';
    var nameEl = document.createElement('div');
    nameEl.textContent = w.name;
    btn.appendChild(iconEl);
    btn.appendChild(nameEl);
    var wCopy = {name:w.name, floors:w.floors||[]};
    btn.addEventListener('click', function(){
      selName = wCopy.name;
      selFloor = '';
      renderNameGrid();
      goStep2();
    });
    g.appendChild(btn);
  });
}

function goStep1(){
  selName = ''; selFloor = '';
  var ld=document.getElementById('loginDate');if(ld)ld.textContent=getTodayStr();
  renderNameGrid();
  setStep(1);
}

function goStep2(){
  loadCfg();
  setStep(2);
  var worker = null;
  for(var i=0; i<cfg.workers.length; i++){
    if(cfg.workers[i].name === selName){ worker = cfg.workers[i]; break; }
  }
  var allowed = worker ? (worker.floors || []) : [];
  var g = document.getElementById('floorSelGrid');
  g.innerHTML = '';
  ALL_FLOORS.forEach(function(f){
    var can = allowed.indexOf(f) >= 0;
    var btn = document.createElement('button');
    btn.className = 'floor-btn2' + (selFloor === f ? ' sel' : '') + (can ? '' : ' disabled');
    var nameEl = document.createElement('div');
    nameEl.textContent = FN[f];
    var subEl = document.createElement('div');
    subEl.className = 'fsub';
    subEl.textContent = can ? (selFloor === f ? '✓선택' : '담당') : '권한없음';
    btn.appendChild(nameEl);
    btn.appendChild(subEl);
    if(can){
      var fCopy = f;
      btn.addEventListener('click', function(){
        selFloor = fCopy;
        goStep2();
      });
    }
    g.appendChild(btn);
  });
  var nextBtn = document.getElementById('step2Next');
  nextBtn.disabled = !selFloor || allowed.indexOf(selFloor) < 0;
}

function goStep3(){
  if(!selFloor) return;
  loadCfg();
  // 작업자 비번 확인
  var worker=null;
  for(var i=0;i<cfg.workers.length;i++){if(cfg.workers[i].name===selName){worker=cfg.workers[i];break;}}
  var workerPw = worker&&worker.password ? worker.password : '';
  if(!workerPw){
    // 비번 없으면 바로 입장
    session = {name:selName, floor:selFloor, loggedIn:true};
    lsSet('plt_session', JSON.stringify(session));
    enterApp();
    return;
  }
  setStep(3);
  var worker = null;
  for(var i=0; i<cfg.workers.length; i++){
    if(cfg.workers[i].name === selName){ worker = cfg.workers[i]; break; }
  }
  var sum = document.getElementById('loginSum');
  sum.innerHTML = '';
  var iconSpan = document.createElement('span');
  iconSpan.style.fontSize = '18px';
  iconSpan.textContent = worker ? (worker.icon || '👤') : '👤';
  var infoDiv = document.createElement('div');
  infoDiv.innerHTML = '<div style="font-size:13px;font-weight:800">' + selName + '</div><div style="font-size:11px;color:#5a7a99">' + FN[selFloor] + ' 입장</div>';
  sum.appendChild(iconSpan);
  sum.appendChild(infoDiv);
  document.getElementById('pwInp').value = '';
  document.getElementById('pwErr').textContent = '';
  setTimeout(function(){ document.getElementById('pwInp').focus(); }, 300);

function goStep2back(){

}

  renderAllFloors();
  updateBadges();
  updatePltNo();
}

/* ===== 입력 ===== */
function getFloorPharmas(){
  var fs = cfg.floorSettings && cfg.floorSettings[currentFloor];
  if(!fs || fs.pharmas === null || fs.pharmas === undefined) return cfg.pharmas;
  return fs.pharmas.length > 0 ? fs.pharmas : cfg.pharmas;
}

function getNextPltNo(){
  var used = {};
  (waiting[currentFloor]||[]).forEach(function(p){ used[p.pltNo] = true; });
  (done[currentFloor]||[]).forEach(function(p){ used[p.pltNo] = true; });
  var n = 1;
  while(used[n]) n++;
  return n;
}

function updatePltNo(){
  var el = document.getElementById('pltNoDisp');
  if(el) el.textContent = getNextPltNo();
}

function buildInputForm(){
  // 택배사
  var chips = document.getElementById('courierChips');
  chips.innerHTML = '';
  cfg.couriers.forEach(function(c){
    var btn = document.createElement('button');
    btn.className = 'c-chip' + (inputCourier === c.id ? ' sel' : '');
    if(inputCourier === c.id){
      btn.style.background = c.color;
      btn.style.borderColor = c.color;
      btn.style.color = '#fff';
    }
    var iconSpan = document.createElement('span');
    iconSpan.textContent = c.icon;
    var nameSpan = document.createElement('span');
    nameSpan.textContent = c.name;
    btn.appendChild(iconSpan);
    btn.appendChild(nameSpan);
    var cCopy = {id:c.id};
    btn.addEventListener('click', function(){
      inputCourier = cCopy.id;
      buildInputForm();
    });
    chips.appendChild(btn);
  });

  // 제약사
  var list = document.getElementById('pharmaInpList');
  list.innerHTML = '';
  var pharmas = getFloorPharmas();
  pharmas.forEach(function(pname, pi){
    var row = document.createElement('div');
    row.className = 'pharma-row';
    var dot = document.createElement('div');
    dot.className = 'ph-dot';
    dot.style.background = PC[pi % PC.length];
    var nm = document.createElement('div');
    nm.className = 'ph-name';
    nm.textContent = pname;
    var inp = document.createElement('input');
    inp.className = 'box-inp';
    inp.type = 'number';
    inp.inputMode = 'numeric';
    inp.placeholder = '0';
    inp.min = '0';
    inp.id = 'bi_' + pi;
    var pCopy = pname;
    inp.addEventListener('input', function(){
      inp.classList.toggle('hv', Number(inp.value) > 0);
      if(inputCourier !== 'hanjin'){
        var auto = PHARMA_MAP[pCopy] || 'koryo';
        var selPharmas = [];
        pharmas.forEach(function(p2, pi2){
          var i2 = document.getElementById('bi_'+pi2);
          if(i2 && Number(i2.value) > 0) selPharmas.push(p2);
        });
        var newCourier = 'koryo';
        for(var si=0; si<selPharmas.length; si++){
          newCourier = PHARMA_MAP[selPharmas[si]] || 'koryo';
          break;
        }
        if(newCourier !== inputCourier){
          var saved = {};
          pharmas.forEach(function(_, pi2){
            var i2 = document.getElementById('bi_'+pi2);
            if(i2) saved[pi2] = i2.value;
          });
          inputCourier = newCourier;
          buildInputForm();
          pharmas.forEach(function(_, pi2){
            var i2 = document.getElementById('bi_'+pi2);
            if(i2 && saved[pi2]){ i2.value = saved[pi2]; i2.classList.toggle('hv', Number(saved[pi2])>0); }
          });
        }
      }
    });
    var unit = document.createElement('div');
    unit.className = 'box-unit';
    unit.textContent = '박스';
    // 제약사별 즉시 승인 버튼
    var phApprove = document.createElement('button');
    phApprove.className = 'ph-approve';
    phApprove.textContent = '✅';
    phApprove.title = pname + ' 즉시 승인';
    (function(pharmaName, inputEl){
      phApprove.addEventListener('click', function(){
        if(!Number(inputEl.value)||Number(inputEl.value)<=0){
          showToast(pharmaName+'\n박스수를 입력하세요','err');
          inputEl.focus();
          return;
        }
        approveSingle(pharmaName, Number(inputEl.value));
      });
    })(pname, inp);
    row.appendChild(dot);
    row.appendChild(nm);
    row.appendChild(inp);
    row.appendChild(unit);
    row.appendChild(phApprove);
    list.appendChild(row);
  });
}

/* 제약사 1개만 즉시 승인 */
function approveSingle(pharmaName, boxCount){
  if(!inputCourier) inputCourier='koryo';
  var pi = getFloorPharmas().indexOf(pharmaName);
  var color = pi>=0 ? PC[pi%PC.length] : PC[0];
  var items = [{pharma:pharmaName, box:boxCount, color:color}];
  var cObj = null;
  for(var i=0;i<cfg.couriers.length;i++){
    if(cfg.couriers[i].id===inputCourier){cObj=cfg.couriers[i];break;}
  }
  if(!cObj) cObj=cfg.couriers[0];
  var pltNo = getNextPltNo();
  var entry = {
    id:Date.now(),
    pltNo:pltNo,
    courierId:cObj.id,
    courierName:cObj.name,
    courierIcon:cObj.icon,
    courierColor:cObj.color,
    items:items,
    floor:currentFloor,
    ts:new Date().toISOString(),
    totalBox:boxCount
  };
  if(!waiting[currentFloor]) waiting[currentFloor]=[];
  waiting[currentFloor].push(entry);
  saveState();
  // 해당 제약사 입력칸만 초기화
  var pharmas=getFloorPharmas();
  var idx=pharmas.indexOf(pharmaName);
  if(idx>=0){
    var inp=document.getElementById('bi_'+idx);
    if(inp){inp.value='';inp.classList.remove('hv');}
  }
  updatePltNo();
  renderWaiting();
  updateBadges();
  syncWaitingToFB();
  showToast('✅ '+pharmaName+'\nNo.'+pltNo+' → 대기');
}

/* 플로팅 버튼 표시/숨김 */
function updateFloatBtn(){
  var btn=document.getElementById('floatApproveBtn');
  var lbl=document.getElementById('floatApproveLabel');
  if(!btn) return;
  var appVisible = document.getElementById('appScreen') && document.getElementById('appScreen').style.display !== 'none';
  if(appVisible && currentTab==='input'){
    btn.classList.add('show');
    if(lbl) lbl.style.display='block';
  } else {
    btn.classList.remove('show');
    if(lbl) lbl.style.display='none';
  }
}

function approveInput(){
  var pltNo = getNextPltNo();
  if(!inputCourier) inputCourier = 'koryo';
  var pharmas = getFloorPharmas();
  var items = [];
  pharmas.forEach(function(pname, pi){
    var inp = document.getElementById('bi_'+pi);
    var v = parseInt(inp ? inp.value : 0) || 0;
    if(v > 0) items.push({pharma:pname, box:v, color:PC[pi%PC.length]});
  });
  if(items.length === 0){ showToast('박스수를 1개 이상 입력하세요','err'); return; }
  var cObj = null;
  for(var i=0; i<cfg.couriers.length; i++){
    if(cfg.couriers[i].id === inputCourier){ cObj = cfg.couriers[i]; break; }
  }
  if(!cObj) cObj = cfg.couriers[0];
  var entry = {
    id: Date.now(),
    pltNo: pltNo,
    courierId: cObj.id,
    courierName: cObj.name,
    courierIcon: cObj.icon,
    courierColor: cObj.color,
    items: items,
    floor: currentFloor,
    ts: new Date().toISOString(),
    totalBox: items.reduce(function(s,it){ return s+it.box; }, 0)
  };
  if(!waiting[currentFloor]) waiting[currentFloor] = [];
  waiting[currentFloor].push(entry);
  saveState();
  pharmas.forEach(function(_, pi){
    var inp = document.getElementById('bi_'+pi);
    if(inp){ inp.value=''; inp.classList.remove('hv'); }
  });
  updatePltNo();
  renderWaiting();
  updateBadges();
  showToast('✅ PLT No.'+pltNo+'\n대기로 이동됨');
  goTab('waiting');
}

function makePltCard(p){
  var isSel = !!wSel[p.id];
  var card = document.createElement('div');
  card.className = 'plt-card' + (isSel ? ' sel' : '');

  var top = document.createElement('div');
  top.className = 'plt-card-top';
  var noTag = document.createElement('div');
  noTag.className = 'plt-no-tag';
  noTag.textContent = 'No.'+p.pltNo;
  var cTag = document.createElement('div');
  cTag.className = 'plt-c-tag';
  cTag.style.background = p.courierColor;
  cTag.textContent = p.courierIcon + p.courierName;

  var editBtn = document.createElement('button');
  editBtn.className = 'plt-edit-btn';
  editBtn.textContent = '✏️';
  var delBtn = document.createElement('button');
  delBtn.className = 'plt-del-btn';
  delBtn.textContent = '🗑';

  top.appendChild(noTag);
  top.appendChild(cTag);
  top.appendChild(editBtn);
  top.appendChild(delBtn);
  card.appendChild(top);

  var vis = document.createElement('div');
  vis.className = 'plt-visual';
  vis.innerHTML = makeSVG(p.courierColor);
  card.appendChild(vis);

  var bot = document.createElement('div');
  bot.className = 'plt-bot';
  var tot = document.createElement('div');
  tot.className = 'plt-tot';
  tot.innerHTML = '<strong>'+p.totalBox+'</strong>BOX';
  bot.appendChild(tot);
  var det = document.createElement('div');
  det.className = 'plt-detail';
  p.items.forEach(function(it){
    var row = document.createElement('div');
    var name = document.createElement('span');
    name.textContent = it.pharma;
    var box = document.createElement('span');
    box.className = 'ro-item-box';
    box.textContent = ' '+it.box+'박스';
    row.appendChild(name);
    row.appendChild(box);
    det.appendChild(row);
  });
  bot.appendChild(det);
  card.appendChild(bot);

  var chk = document.createElement('div');
  chk.className = 'plt-chk';
  chk.textContent = '✓';
  if(isSel) chk.style.display = 'flex';
  card.appendChild(chk);

  // 이벤트
  var pCopy = {id:p.id, pltNo:p.pltNo};
  card.addEventListener('click', function(){
    if(wSel[pCopy.id]) delete wSel[pCopy.id];
    else wSel[pCopy.id] = true;
    card.classList.toggle('sel');
    chk.style.display = wSel[pCopy.id] ? 'flex' : 'none';
    updateWSelBar();
  });
  editBtn.addEventListener('click', function(e){
    e.stopPropagation();
    showToast('수정 기능 준비중','err');
  });
  delBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if(confirm('PLT No.'+pCopy.pltNo+' 삭제?')){
      waiting[currentFloor] = (waiting[currentFloor]||[]).filter(function(x){ return x.id !== pCopy.id; });
      delete wSel[pCopy.id];
      saveState();
      renderWaiting();
      updateBadges();
      updatePltNo();
      syncWaitingToFB();
    }
  });
  return card;
}

/* ===== 대기 ===== */
function renderWaiting(){
  var list = waiting[currentFloor] || [];
  var g = document.getElementById('waitGrid');
  g.innerHTML = '';
  if(list.length === 0){
    var em = document.createElement('div');
    em.className = 'empty';
    em.innerHTML = '<div class="empty-icon">📭</div><div>대기 중인 파레트가 없습니다</div>';
    g.appendChild(em);
  } else {
    var sorted = list.slice().sort(function(a,b){
      return a.courierId > b.courierId ? 1 : a.courierId < b.courierId ? -1 : a.pltNo - b.pltNo;
    });
    sorted.forEach(function(p){ g.appendChild(makePltCard(p)); });
  }
  updateWSelBar();
}

function updateWSelBar(){
  var cnt = Object.keys(wSel).length;
  document.getElementById('wSelCnt').textContent = cnt+'개';
  document.getElementById('sendBtn').disabled = cnt === 0;
}

function sendPallets(){
  var ids = Object.keys(wSel);
  if(ids.length === 0) return;
  var rem = [], mov = [];
  (waiting[currentFloor]||[]).forEach(function(p){
    if(wSel[p.id]) mov.push(p);
    else rem.push(p);
  });
  waiting[currentFloor] = rem;
  if(!done[currentFloor]) done[currentFloor] = [];
  mov.forEach(function(p){ done[currentFloor].push(p); });
  wSel = {};

  var payload = {
    floor: currentFloor,
    floorName: FN[currentFloor],
    worker: session.name,
    sentAt: new Date().toISOString(),
    pallets: mov,
    type: 'shipment'
  };
  fetch(FB_URL + '/shipments/' + currentFloor + '_' + Date.now() + '.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).catch(function(){});

  syncWaitingToFB();
  saveState();
  renderWaiting();
  renderAllFloors();
  updateBadges();
  updatePltNo();
  showToast('🚀 ' + mov.length + '개 출고팀에 전송!');

  if((waiting[currentFloor]||[]).length === 0){
    setTimeout(checkClose, 600);
  }
}

function selectAllWaiting(){
  var list = waiting[currentFloor] || [];
  var allSel = list.length > 0 && list.every(function(p){ return wSel[p.id]; });
  wSel = {};
  if(!allSel) list.forEach(function(p){ wSel[p.id] = true; });
  renderWaiting();
}

/* ===== 전층 현황 ===== */
function renderAllFloors(){
  var container = document.getElementById('allFloorList');
  container.innerHTML = '';
  var now = new Date();
  var el = document.getElementById('allFloorTime');
  if(el) el.textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' 기준';

  ALL_FLOORS.forEach(function(floor){
    var list = waiting[floor] || [];
    var isDone = doneStatus[floor] || false;
    var isMyFloor = floor === currentFloor;

    var sec = document.createElement('div');
    sec.className = 'all-floor-sec';

    var hdr = document.createElement('div');
    hdr.className = 'afs-hdr';
    var badge = document.createElement('div');
    badge.className = 'afs-badge';
    badge.style.background = FCOLORS[floor];
    badge.textContent = FN[floor];
    var cnt = document.createElement('div');
    cnt.className = 'afs-cnt';
    if(isDone){
      cnt.innerHTML = '<span class="done-chip">✅ 마감완료</span>';
    } else {
      cnt.innerHTML = '대기 <strong style="color:var(--a5)">' + list.length + '</strong>개';
    }
    if(isMyFloor){
      var mine = document.createElement('span');
      mine.className = 'afs-mine';
      mine.textContent = '● 내 층';
      hdr.appendChild(badge);
      hdr.appendChild(mine);
    } else {
      hdr.appendChild(badge);
    }
    hdr.appendChild(cnt);
    sec.appendChild(hdr);

    if(!isDone && list.length > 0){
      var body = document.createElement('div');
      body.className = 'afs-body';
      var grid = document.createElement('div');
      grid.className = 'all-plt-grid';
      var sorted = list.slice().sort(function(a,b){
        return a.courierId > b.courierId ? 1 : a.courierId < b.courierId ? -1 : a.pltNo - b.pltNo;
      });
      sorted.forEach(function(p){
        if(isMyFloor){
          grid.appendChild(makePltCard(p));
        } else {
          var ro = document.createElement('div');
          ro.className = 'ro-card';
          var rTop = document.createElement('div');
          rTop.className = 'ro-top';
          var rNo = document.createElement('div');
          rNo.className = 'ro-no';
          rNo.textContent = 'No.'+p.pltNo;
          var rC = document.createElement('div');
          rC.className = 'ro-c';
          rC.style.background = p.courierColor;
          rC.textContent = p.courierName;
          rTop.appendChild(rNo);
          rTop.appendChild(rC);
          ro.appendChild(rTop);
          var rBox = document.createElement('div');
          rBox.className = 'ro-box';
          rBox.textContent = p.totalBox + 'BOX';
          ro.appendChild(rBox);
          p.items.forEach(function(it){
            var rItem = document.createElement('div');
            rItem.className = 'ro-item';
            rItem.innerHTML = it.pharma + '<span class="ro-item-box"> ' + it.box + '박스</span>';
            ro.appendChild(rItem);
          });
          grid.appendChild(ro);
        }
      });
      body.appendChild(grid);
      sec.appendChild(body);
    } else if(!isDone){
      var body2 = document.createElement('div');
      body2.className = 'afs-body';
      var em2 = document.createElement('div');
      em2.className = 'afs-empty';
      em2.textContent = '대기 없음';
      body2.appendChild(em2);
      sec.appendChild(body2);
    }
    container.appendChild(sec);
  });
}

function syncWaitingToFB(){
  fetch(FB_URL + '/waiting.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({data:waiting, updatedAt:new Date().toISOString(), doneStatus:doneStatus})
  }).catch(function(){});
}

function loadAllFromFB(){
  // reset_signal 감지 먼저 확인
  fetch(FB_URL + '/reset_signal.json')
    .then(function(r){return r.json();})
    .then(function(sig){
      if(sig && sig.resetAt){
        var lastReset = lsGet('plt_last_reset');
        if(lastReset !== sig.resetAt){
          // 새 초기화 신호 감지 → 로컬 상태 초기화
          lsSet('plt_last_reset', sig.resetAt);
          lsSet('plt_last_day', sig.date||getDayKey());
          waiting={};done={};doneStatus={};
          ALL_FLOORS.forEach(function(f){waiting[f]=[];done[f]=[];});
          saveState();
          renderWaiting();
          renderAllFloors();
          updateBadges();
          updatePltNo();
          showToast('🔄 일일 초기화됨\n새 작업을 시작하세요');
        }
      }
    }).catch(function(){});

  fetch(FB_URL + '/waiting.json')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.data){
        ALL_FLOORS.forEach(function(f){
          if(f !== currentFloor && d.data[f]) waiting[f] = d.data[f];
        });
        if(d.doneStatus) Object.assign(doneStatus, d.doneStatus);
      }
      renderAllFloors();
      updateBadges();
    }).catch(function(){});
}

/* ===== 마감 ===== */
function checkClose(){
  var wc = (waiting[currentFloor]||[]).length;
  var dc = (done[currentFloor]||[]).length;
  if(wc === 0 && dc > 0){
    document.getElementById('closeTitle').textContent = FN[currentFloor] + ' 마감하시겠습니까?';
    document.getElementById('closeSub').textContent = '총 ' + dc + '개 파레트를 마감 처리합니다.\n출고팀·관리자에게 알림이 전송됩니다.';
    showOverlay('closeOverlay');
  } else if(wc > 0){
    showToast('대기 ' + wc + '개 남아있어\n마감할 수 없습니다', 'err');
  } else {
    showToast('출고된 파레트가 없습니다', 'err');
  }
}

function doClose(){
  hideOverlay('closeOverlay');
  _report = {
    floor: currentFloor,
    floorName: FN[currentFloor],
    worker: session.name,
    closedAt: new Date().toISOString(),
    pallets: done[currentFloor] || []
  };
  doneStatus[currentFloor] = true;
  fetch(FB_URL + '/reports/' + currentFloor + '_' + Date.now() + '.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({type:'closing'}, _report))
  }).catch(function(){});
  fetch(FB_URL + '/notifications/' + currentFloor + '.json', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      floor: currentFloor,
      floorName: FN[currentFloor],
      worker: session.name,
      closedAt: _report.closedAt,
      totalPlt: _report.pallets.length,
      totalBox: _report.pallets.reduce(function(s,p){ return s+p.totalBox; }, 0),
      type: 'closing'
    })
  }).catch(function(){});
  syncWaitingToFB();
  done[currentFloor] = [];
  waiting[currentFloor] = [];
  saveState();
  renderWaiting();
  renderAllFloors();
  updateBadges();
  updatePltNo();
  showReport();
}

/* ===== 보고서 ===== */
function showReport(){
  if(!_report) return;
  var pallets = _report.pallets || [];
  var now = new Date(_report.closedAt);
  var ds = (now.getMonth()+1) + '월' + now.getDate() + '일 ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  var totalBox = pallets.reduce(function(s,p){ return s+p.totalBox; }, 0);
  var html = '<div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px">' + FN[_report.floor] + ' · ' + _report.worker + ' · ' + ds + '</div>';
  html += '<table class="rp-table"><thead><tr><th>PLT</th><th>택배사</th><th>제약사</th><th>BOX</th></tr></thead><tbody>';
  pallets.forEach(function(p){
    p.items.forEach(function(item, i){
      html += '<tr>';
      if(i === 0){
        html += '<td rowspan="'+p.items.length+'" style="text-align:center;font-weight:900;color:var(--a5)">No.'+p.pltNo+'</td>';
        html += '<td rowspan="'+p.items.length+'" style="text-align:center">'+p.courierIcon+' '+p.courierName+'</td>';
      }
      html += '<td>'+item.pharma+'</td><td style="text-align:center;font-weight:700">'+item.box+'</td></tr>';
    });
  });
  html += '</tbody><tfoot><tr><td colspan="2" style="text-align:center">합계</td><td style="text-align:center">'+pallets.length+'PLT</td><td style="text-align:center;color:var(--a3)">'+totalBox+'BOX</td></tr></tfoot></table>';
  document.getElementById('reportBody').innerHTML = html;
  showOverlay('reportOverlay');
}

function doPrint(){
  if(!_report) return;
  var pallets = _report.pallets || [];
  var now = new Date(_report.closedAt);
  var ds = now.getFullYear() + '년 ' + (now.getMonth()+1) + '월 ' + now.getDate() + '일';
  var totalBox = pallets.reduce(function(s,p){ return s+p.totalBox; }, 0);
  var rows = '';
  pallets.forEach(function(p){
    p.items.forEach(function(item, i){
      rows += '<tr>';
      if(i === 0) rows += '<td rowspan="'+p.items.length+'" style="text-align:center;font-weight:900">No.'+p.pltNo+'</td><td rowspan="'+p.items.length+'" style="text-align:center">'+p.courierName+'</td>';
      rows += '<td>'+item.pharma+'</td><td style="text-align:center;font-weight:700">'+item.box+'</td></tr>';
    });
  });
  document.getElementById('printArea').innerHTML =
    '<h2>출고 파레트 마감 보고서</h2><div class="pi">'+FN[_report.floor]+' | 담당: '+_report.worker+' | '+ds+'</div>' +
    '<table><thead><tr><th>PLT No.</th><th>택배사</th><th>제약사</th><th>BOX수</th></tr></thead>' +
    '<tbody>'+rows+'</tbody>' +
    '<tfoot><tr><td colspan="2" style="text-align:center">합계</td><td style="text-align:center">'+pallets.length+'PLT</td><td style="text-align:center">'+totalBox+'BOX</td></tr></tfoot></table>';
  setTimeout(function(){ window.print(); }, 200);
}

function doCSV(){
  if(!_report) return;
  var pallets = _report.pallets || [];
  var now = new Date(_report.closedAt || Date.now());
  var csv = '파레트번호,택배사,제약사,BOX수\n';
  pallets.forEach(function(p){
    p.items.forEach(function(item){
      csv += 'No.'+p.pltNo+','+p.courierName+','+item.pharma+','+item.box+'\n';
    });
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv'}));
  a.download = '파레트보고서_'+FN[_report.floor]+'_'+(now.getMonth()+1)+'월'+now.getDate()+'일.csv';
  a.click();
}

function updateBadges(){
  var wc = (waiting[currentFloor]||[]).length;
  var allWc = 0;
  ALL_FLOORS.forEach(function(f){ allWc += (waiting[f]||[]).length; });
  var wb = document.getElementById('wBadge');
  var ob = document.getElementById('oBadge');
  wb.style.display = wc > 0 ? 'block' : 'none';
  wb.textContent = wc;
  ob.style.display = allWc > 0 ? 'block' : 'none';
  ob.textContent = allWc;
}

/* ===== 이벤트 바인딩 ===== */

/* ════ 예상 파레트 ════ */
var expectData = {};

function loadExpectData(){
  var s=lsGet('plt_expect');
  if(s){try{expectData=JSON.parse(s);}catch(e){}}
}

function saveExpectData(){
  lsSet('plt_expect',JSON.stringify(expectData));
}

function renderExpectInput(){
  loadExpectData();
  var area=document.getElementById('expectInputArea');
  if(!area)return;
  area.innerHTML='';

  // 본인 담당 층만
  var worker=null;
  for(var i=0;i<cfg.workers.length;i++){if(cfg.workers[i].name===session.name){worker=cfg.workers[i];break;}}
  var myFloors=worker&&worker.floors&&worker.floors.length?worker.floors:[currentFloor];
  var couriers=cfg.couriers&&cfg.couriers.length?cfg.couriers:DC;

  // 층 안내
  var info=document.createElement('div');
  info.style.cssText='background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--a4);font-weight:700;';
  info.textContent='📋 '+session.name+'님 담당: '+myFloors.map(function(f){return FN[f];}).join(', ');
  area.appendChild(info);

  // 담당 층 × 택배사 입력
  myFloors.forEach(function(floor){
    // 층 헤더
    var floorHdr=document.createElement('div');
    floorHdr.style.cssText='background:'+FCOLORS[floor]+';color:#fff;border-radius:9px;padding:8px 12px;margin-bottom:6px;margin-top:10px;font-size:13px;font-weight:900;';
    floorHdr.textContent='🏢 '+FN[floor];
    area.appendChild(floorHdr);

    couriers.forEach(function(c){
      var key=floor+'_'+c.id;
      var curVal=expectData[key]||0;

      // 카드 형태로 - 택배사명 위, 숫자 아래
      var card=document.createElement('div');
      card.style.cssText='background:var(--card2);border:2px solid '+(curVal>0?c.color:'var(--border)')+';border-radius:11px;padding:10px;margin-bottom:7px;';

      // 택배사 라벨
      var lbl=document.createElement('div');
      lbl.style.cssText='display:flex;align-items:center;gap:6px;margin-bottom:8px;';
      var dot=document.createElement('div');
      dot.style.cssText='width:10px;height:10px;border-radius:50%;background:'+c.color+';flex-shrink:0;';
      var nm=document.createElement('div');
      nm.style.cssText='font-size:13px;font-weight:800;color:'+c.color+';';
      nm.textContent=c.icon+' '+c.name;
      var unitTop=document.createElement('div');
      unitTop.style.cssText='margin-left:auto;font-size:10px;color:var(--muted);font-weight:700;';
      unitTop.textContent='예상 PLT 수';
      lbl.appendChild(dot);lbl.appendChild(nm);lbl.appendChild(unitTop);
      card.appendChild(lbl);

      // 숫자 입력 (크게)
      var inp=document.createElement('input');
      inp.type='number';inp.inputMode='numeric';inp.min='0';
      inp.value=curVal>0?curVal:'';
      inp.placeholder='0';
      inp.style.cssText='width:100%;background:var(--bg);border:1.5px solid '+(curVal>0?c.color:'var(--border)')+';border-radius:9px;color:'+(curVal>0?c.color:'var(--text)')+';font-size:28px;font-weight:900;padding:10px;outline:none;font-family:inherit;text-align:center;-webkit-appearance:none;box-sizing:border-box;';

      (function(k2,col,cardEl){
        inp.addEventListener('input',function(){
          var v=parseInt(inp.value)||0;
          expectData[k2]=v;
          saveExpectData();
          var hasVal=v>0;
          inp.style.borderColor=hasVal?col:'var(--border)';
          inp.style.color=hasVal?col:'var(--text)';
          cardEl.style.borderColor=hasVal?col:'var(--border)';
        });
      })(key,c.color,card);

      card.appendChild(inp);
      area.appendChild(card);
    });
  });
}

function sendExpectData(){
  loadExpectData();
  var hasData=Object.values(expectData).some(function(v){return v>0;});
  if(!hasData){showToast('예상 수량을 입력해주세요','err');return;}
  var payload={floor:currentFloor,worker:session.name,sentAt:new Date().toISOString(),data:expectData,type:'expect'};
  fetch(FB_URL+'/expect.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(){showToast('📤 예상 데이터 전송 완료!');})
    .catch(function(){showToast('전송 실패','err');});
}

  // 로그인 버튼들
  document.getElementById('step2Next').addEventListener('click', goStep3);

  document.getElementById('pwInp').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('pwEye').addEventListener('click', function(){
    var inp = document.getElementById('pwInp');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  // 앱 버튼들
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('bn-input').addEventListener('click', function(){ goTab('input'); });
  document.getElementById('bn-expect').addEventListener('click', function(){ goTab('expect'); });
  document.getElementById('bn-waiting').addEventListener('click', function(){ goTab('waiting'); });
  document.getElementById('bn-output').addEventListener('click', function(){ goTab('output'); });
  var abi=document.getElementById('approveBtnInner');if(abi)abi.addEventListener('click', approveInput);
  var fab=document.getElementById('floatApproveBtn');if(fab)fab.addEventListener('click', approveInput);
  document.getElementById('sendBtn').addEventListener('click', sendPallets);
  var seb=document.getElementById('sendExpectBtn');if(seb)seb.addEventListener('click', sendExpectData);
  var sab=document.getElementById('selAllBtn');if(sab)sab.addEventListener('click', selectAllWaiting);

  // 팝업 버튼들
  document.getElementById('doCloseBtn').addEventListener('click', doClose);
  document.getElementById('cancelCloseBtn').addEventListener('click', function(){ hideOverlay('closeOverlay'); });
  document.getElementById('printBtn').addEventListener('click', doPrint);
  document.getElementById('csvBtn').addEventListener('click', doCSV);
  document.getElementById('closeReportBtn').addEventListener('click', function(){ hideOverlay('reportOverlay'); });

  // 세션 복원
  var s = lsGet('plt_session');
  if(s){
    try {
      var d = JSON.parse(s);
      if(d && d.loggedIn && d.name && d.floor){
        session = d;
        enterApp();
        return;
      }
    } catch(e) {}
  }
  var ld=document.getElementById('loginDate');if(ld)ld.textContent=getTodayStr();
  renderNameGrid();
  setStep(1);
});
