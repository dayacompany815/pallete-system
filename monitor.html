<!DOCTYPE html>
<html lang="ko" class="theme-monitor">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출고지기 PC버전</title>
<link rel="apple-touch-icon" href="icon-pc.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="출고지기 PC버전">
<link rel="manifest" href="manifest-monitor.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0B0F14">
<link rel="stylesheet" href="css/monitor-theme.css">
<style>
:root{
  --bg:#0B0F14;--card:#151B23;--card2:#1C2430;--border:#2A3441;
  --text:#E8EDF4;--muted:#8B9AAB;
  --a1:#22D3EE;--a2:#FB923C;--a3:#4ADE80;--a4:#818CF8;--a5:#FBBF24;--a6:#F472B6;
  --red:#F87171;
  --waiting:#FB923C;
  --shipped:#4ADE80;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── 헤더 ── */
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.hdr-title{font-size:18px;font-weight:900;color:var(--text);}
.hdr-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.hdr-r{display:flex;align-items:center;gap:10px;}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--a3);box-shadow:0 0 8px var(--a3);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.last-upd{font-size:11px;color:var(--muted);}
.hdr-btn{background:rgba(3,199,90,.1);border:1.5px solid rgba(3,199,90,.35);color:var(--a1);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.hdr-btn-set{background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.4);color:#a5b4fc;}

/* ── 탭 ── */
.main-tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:2px;padding:0 24px;position:sticky;top:58px;z-index:100;overflow-x:auto;}
.main-tab{border:none;background:transparent;cursor:pointer;font-family:inherit;padding:10px 16px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;}
.main-tab.active{color:var(--a1);border-bottom-color:var(--a1);}
.tab-badge{display:inline-block;background:var(--a2);color:#fff;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:900;margin-left:5px;}
.tab-badge.green{background:var(--a3);}
.tab-badge.purple{background:var(--a4);}

/* ── 뷰 전환 ── */
.view-bar{background:var(--card2);padding:8px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.view-toggle{display:flex;gap:5px;background:var(--bg);border-radius:8px;padding:3px;border:1px solid var(--border);}
.vt-btn{border:none;background:transparent;color:var(--muted);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.vt-btn.active{background:var(--a1);color:#fff;}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1.5px solid var(--border);background:transparent;color:var(--muted);border-radius:14px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.chip.active{border-color:var(--a1);color:var(--a1);background:rgba(3,199,90,.08);}

/* ── 메인 ── */
.main{padding:16px 24px;max-width:1800px;margin:0 auto;}
.tab-page{display:none;}
.tab-page.active{display:block;}

/* ── 요약 카드 ── */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 16px;position:relative;overflow:hidden;}
.sum-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.sc-icon{font-size:18px;margin-bottom:4px;}
.sc-label{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px;}
.sc-val{font-size:26px;font-weight:900;line-height:1;}
.sc-sub{font-size:10px;color:var(--muted);margin-top:3px;}

/* ── 섹션 타이틀 ── */
.sec-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;}
.sec-title.waiting-title{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.2);color:var(--waiting);}
.sec-title.shipped-title{background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.2);color:var(--shipped);}
.sec-cnt{font-size:11px;color:var(--muted);margin-left:auto;font-weight:600;}

/* ── 파레트 카드 (카드뷰) ── */
.plt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px;}
.plt-card{border-radius:13px;overflow:hidden;position:relative;}
.plt-card.waiting{background:var(--card);border:2px solid rgba(249,115,22,.4);}
.plt-card.shipped{background:var(--card);border:2px solid rgba(46,204,113,.4);}
.plt-card-top{padding:7px 9px 4px;display:flex;align-items:center;justify-content:space-between;}
.plt-no{border-radius:5px;padding:2px 7px;font-size:12px;font-weight:900;}
.plt-no.waiting{background:var(--a5);color:#000;}
.plt-no.shipped{background:var(--a3);color:#000;}
.plt-c-tag{font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;color:#fff;}
.plt-status-tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;}
.plt-status-tag.waiting{background:rgba(249,115,22,.2);color:var(--waiting);}
.plt-status-tag.shipped{background:rgba(46,204,113,.2);color:var(--shipped);}
.plt-visual{padding:4px 7px;display:flex;justify-content:center;}
.plt-bot{padding:3px 8px 8px;}
.plt-tot{font-size:13px;font-weight:900;}
.plt-detail{font-size:10px;font-weight:600;line-height:1.6;margin-top:2px;}
.plt-detail-box{color:var(--muted);font-size:9px;}
.plt-floor-tag{font-size:9px;color:var(--muted);margin-top:2px;}

/* 되돌리기 버튼 */
.return-btn{width:100%;background:rgba(249,115,22,.1);border:1.5px solid rgba(249,115,22,.3);color:var(--a2);border-radius:7px;padding:5px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin:4px 8px 8px;width:calc(100% - 16px);display:block;}
.return-btn:hover{background:rgba(249,115,22,.2);}

/* ── 텍스트뷰 테이블 ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:20px;}
.tbl-hdr{padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--border);font-size:12px;font-weight:800;}
table{width:100%;border-collapse:collapse;}
th{background:var(--card2);color:var(--muted);font-size:10px;font-weight:700;padding:8px 10px;text-align:left;border:1px solid var(--border);white-space:nowrap;}
td{padding:7px 10px;border:1px solid var(--border);font-size:12px;vertical-align:middle;}
tr:hover td{background:rgba(3,199,90,.03);}
tfoot td{background:var(--card2);font-weight:800;}
.status-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;}
.status-pill.waiting{background:rgba(249,115,22,.15);color:var(--waiting);border:1px solid rgba(249,115,22,.3);}
.status-pill.shipped{background:rgba(46,204,113,.15);color:var(--shipped);border:1px solid rgba(46,204,113,.3);}

/* ── 층별 현황 ── */
.floor-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.floor-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.floor-card-hdr{padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
.floor-badge{padding:3px 9px;border-radius:6px;font-size:11px;font-weight:900;color:#fff;flex-shrink:0;}
.floor-card-body{padding:8px 10px;}
.floor-stat-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);font-size:11px;}
.floor-stat-row:last-child{border-bottom:none;}
.floor-stat-label{color:var(--muted);}
.floor-stat-val{font-weight:800;}

/* 마감알림 */
.alert-bar{background:rgba(46,204,113,.06);border-bottom:1px solid rgba(46,204,113,.2);padding:8px 24px;display:flex;flex-wrap:wrap;gap:8px;}
.alert-chip{background:var(--card);border:1.5px solid var(--a3);border-radius:9px;padding:5px 12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;}

/* 테이블 헤더 */
.tbl-title{padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--border);font-size:12px;font-weight:800;}

/* 예상현황 KPI */
.kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;text-align:center;}
.kpi-icon{font-size:22px;margin-bottom:4px;}
.kpi-label{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.kpi-val{font-size:28px;font-weight:900;line-height:1;}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:3px;}

/* 오버레이 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.show{display:flex;}
.report-modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;}

/* 파레트 상세 모달 */
.plt-modal{background:var(--card);border-radius:18px;width:100%;max-width:360px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.plt-modal-hdr{padding:16px 18px;display:flex;align-items:center;gap:10px;}
.plt-modal-body{padding:14px 18px 18px;}
.plt-modal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.plt-modal-row:last-child{border-bottom:none;}
.plt-modal-lbl{color:var(--muted);font-weight:600;}
.plt-modal-val{font-weight:800;}
.plt-modal-item{display:flex;justify-content:space-between;padding:5px 10px;border-radius:7px;font-size:12px;margin-bottom:4px;}
.plt-modal-close{width:100%;margin-top:14px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.plt-card{cursor:pointer;transition:opacity .15s;}
.plt-card:hover{opacity:.88;}
.floor-card{cursor:pointer;transition:opacity .15s;}
.floor-card:hover{opacity:.88;}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">📊 출고지기 PC버전</div>
    <div class="hdr-sub">전층 실시간 모니터링 · Firebase 연동</div>
  </div>
  <div class="hdr-r">
    <div class="live-dot"></div>
    <div class="last-upd" id="lastUpd">--:--</div>
    <button class="hdr-btn" onclick="loadData()">🔄 새로고침</button>
    <button class="hdr-btn hdr-btn-set" onclick="window.open('settings.html','_blank')">⚙️ 설정관리</button>
  </div>
</div>

<!-- 마감 알림 -->
<div class="alert-bar" id="alertBar" style="display:none"></div>

<!-- 메인 탭 -->
<div class="main-tabs">
  <button class="main-tab active" id="tab-waiting" onclick="switchTab('waiting')">
    ⏳ 대기중 <span class="tab-badge" id="waitingCntBadge">0</span>
  </button>
  <button class="main-tab" id="tab-shipped" onclick="switchTab('shipped')">
    ✅ 출고완료 <span class="tab-badge green" id="shippedCntBadge">0</span>
  </button>
  <button class="main-tab" id="tab-overview" onclick="switchTab('overview')">
    🏢 층별현황
  </button>
  <button class="main-tab" id="tab-closing" onclick="switchTab('closing')">🏁 마감현황 <span class="tab-badge purple" id="closeBadge">0</span></button>
  <button class="main-tab" id="tab-courier" onclick="switchTab('courier')">🚚 택배사</button>
  <button class="main-tab" id="tab-pharma" onclick="switchTab('pharma')">💊 제약사</button>
  <button class="main-tab" id="tab-summary" onclick="switchTab('summary')">📈 통계</button>
  <button class="main-tab" id="tab-expect" onclick="switchTab('expect')">📋 예상현황</button>
  <button class="main-tab" id="tab-history" onclick="switchTab('history')">📅 과거데이터</button>
</div>

<!-- 뷰 전환 바 -->
<div class="view-bar">
  <div class="view-toggle">
    <button class="vt-btn active" id="vt-card" onclick="setView('card')">🗂 카드</button>
    <button class="vt-btn" id="vt-text" onclick="setView('text')">📋 텍스트</button>
  </div>
  <div class="filter-chips" id="floorChips"></div>
</div>

<div class="main">
  <div class="kpi-grid" id="kpiGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px;"></div>

  <!-- 대기중 탭 -->
  <div class="tab-page active" id="page-waiting">
    <div id="waitingContent"></div>
  </div>

  <!-- 출고완료 탭 -->
  <div class="tab-page" id="page-shipped">
    <div id="shippedContent"></div>
  </div>

  <!-- 층별현황 탭 -->
  <div class="tab-page" id="page-overview">
    <div id="overviewContent"></div>
  </div>

  <!-- 마감현황 탭 -->
  <div class="tab-page" id="page-closing">
    <div id="closingContent"></div>
  </div>

  <!-- 택배사 탭 -->
  <div class="tab-page" id="page-courier">
    <div id="courierContent"></div>
  </div>

  <!-- 제약사 탭 -->
  <div class="tab-page" id="page-pharma">
    <div id="pharmaContent"></div>
  </div>

  <!-- 통계 탭 -->
  <div class="tab-page" id="page-summary">
    <div id="summaryContent"></div>
  </div>

  <!-- 예상현황 탭 -->
  <div class="tab-page" id="page-expect">
    <div id="expectContent"></div>
  </div>

  <!-- 과거데이터 탭 -->
  <div class="tab-page" id="page-history">
    <div id="historyContent"></div>
  </div>
</div>

<script>
var FB_URL = 'https://pallete-system-default-rtdb.asia-southeast1.firebasedatabase.app';
var DEFAULT_FLOORS = [
  {id:'B1', name:'지하1층', color:'#3b9eff'},
  {id:'1F', name:'1층', color:'#a78bfa'},
  {id:'3F', name:'3층', color:'#f97316'},
  {id:'4F', name:'4층', color:'#2ecc71'},
  {id:'5F', name:'5층', color:'#ffd600'}
];
var ALL_FLOORS = [];
var FN = {};
var FCOLORS = {};
var ELEVATORS = {office:'사무 엘베', inbound:'입고 엘베'};
var ELEV_EMOJI = {office:'🏢', inbound:'📥'};
var ELEV_COLOR = {office:'#03C75A', inbound:'#2d6cdf'};
var DC = [
  {id:'koryo',name:'고려택배',icon:'📦',color:'#3b9eff'},
  {id:'hanjin',name:'한진',icon:'🚚',color:'#a78bfa'},
  {id:'cj',name:'CJ',icon:'📫',color:'#f97316'},
  {id:'yongma',name:'용마',icon:'🏎',color:'#2ecc71'}
];

var waiting = {}, doneStatus = {}, notifications = {}, closingReports = {};
var shipments = {};
var reports = {};
var cfg = {couriers: DC, floors: DEFAULT_FLOORS.map(function(f){return Object.assign({}, f);})};
var currentTab = 'waiting', viewMode = 'card', floorFilter = 'all';

function pad(n){return String(n).padStart(2,'0');}

/* 스토리지 */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

function loadCfgLocal(){
  var s=lsGet('plt_cfg');
  if(s){try{applyConfig(JSON.parse(s), false);}catch(e){}}
  refreshFloorGlobals();
}

function normalizeFloorId(id){return String(id||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');}
function normalizeFloors(floors){
  var palette=['#3b9eff','#a78bfa','#f97316','#2ecc71','#ffd600','#ff6b9d','#06b6d4','#84cc16','#ef4444','#14b8a6'];
  var seen={}, src=Array.isArray(floors)&&floors.length?floors:DEFAULT_FLOORS, out=[];
  src.forEach(function(f,i){
    var id=normalizeFloorId(f&&f.id);
    if(!id||seen[id])return;
    seen[id]=true;
    out.push({id:id,name:String((f&&f.name)||id).trim()||id,color:String((f&&f.color)||palette[i%palette.length]).trim()||palette[i%palette.length]});
  });
  return out.length?out:DEFAULT_FLOORS.map(function(f){return Object.assign({},f);});
}
function refreshFloorGlobals(){
  cfg.floors=normalizeFloors(cfg.floors);
  ALL_FLOORS=cfg.floors.map(function(f){return f.id;});
  FN={};FCOLORS={};
  cfg.floors.forEach(function(f,i){
    FN[f.id]=f.name;
    FCOLORS[f.id]=f.color||'#3b9eff';
  });
  renderFloorChips();
}
function applyConfig(c, persist){
  if(!c||typeof c!=='object')return;
  if(c.couriers&&c.couriers.length)cfg.couriers=c.couriers;
  if(c.floors&&c.floors.length)cfg.floors=c.floors;
  refreshFloorGlobals();
  if(persist)lsSet('plt_cfg',JSON.stringify(Object.assign({},c,{couriers:cfg.couriers,floors:cfg.floors})));
}
async function loadCfgRemote(){
  try{
    var r=await fetch(FB_URL+'/config.json?t='+Date.now());
    var c=await r.json();
    applyConfig(c, true);
  }catch(e){}
}

function renderFloorChips(){
  var wrap=document.getElementById('floorChips');
  if(!wrap)return;
  if(floorFilter!=='all'&&ALL_FLOORS.indexOf(floorFilter)<0)floorFilter='all';
  wrap.innerHTML='';
  var all=document.createElement('button');
  all.className='chip'+(floorFilter==='all'?' active':'');
  all.setAttribute('data-floor','all');
  all.textContent='전체';
  all.onclick=function(){setFloor('all',all);};
  wrap.appendChild(all);
  ALL_FLOORS.forEach(function(f){
    var b=document.createElement('button');
    b.className='chip'+(floorFilter===f?' active':'');
    b.setAttribute('data-floor',f);
    b.textContent=FN[f]||f;
    b.onclick=function(){setFloor(f,b);};
    wrap.appendChild(b);
  });
}

async function loadData(isAuto){
  loadCfgLocal();
  try{
    await loadCfgRemote();
    var _t = Date.now();
    var r1 = await fetch(FB_URL+'/waiting.json?t='+_t);
    var d1 = await r1.json();
    if(d1){
      // data 키가 없으면 = 대기 전부 비워진 상태(Firebase가 빈 배열을 삭제함). 옛 목록 유지 금지
      waiting = d1.data || {};
      doneStatus = d1.doneStatus || {};
    }
    var r2 = await fetch(FB_URL+'/shipments.json?t='+_t);
    var d2 = await r2.json();
    shipments = d2 || {};
    var r3 = await fetch(FB_URL+'/notifications.json?t='+_t);
    var d3 = await r3.json();
    notifications = d3 || {};
    closingReports = notifications;
    var r4 = await fetch(FB_URL+'/reports.json?t='+_t);
    var d4 = await r4.json();
    reports = d4 || {};

    var now = new Date();
    document.getElementById('lastUpd').textContent =
      pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  } catch(e){
    var s=lsGet('plt_state');
    if(s){try{var d=JSON.parse(s);waiting=d.waiting||{};doneStatus=d.doneStatus||{};}catch(e2){}}
    document.getElementById('lastUpd').textContent='로컬 데이터';
  }
  render(isAuto);
}

/* 탭/뷰 전환 */
var LIST_TABS = ['waiting','shipped']; // 뷰 바(카드/텍스트·층 필터)가 필요한 탭
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.main-tab').forEach(function(b){b.classList.toggle('active',b.id==='tab-'+tab);});
  document.querySelectorAll('.tab-page').forEach(function(p){p.classList.toggle('active',p.id==='page-'+tab);});
  document.querySelector('.view-bar').style.display = LIST_TABS.indexOf(tab)>=0 ? 'flex' : 'none';
  renderCurrentTab();
}

function setView(v){
  viewMode = v;
  document.getElementById('vt-card').classList.toggle('active', v==='card');
  document.getElementById('vt-text').classList.toggle('active', v==='text');
  renderCurrentTab();
}

function setFloor(f, btn){
  floorFilter = f;
  document.querySelectorAll('[data-floor]').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-floor')===f);
  });
  renderCurrentTab();
}

var STATIC_TABS = ['expect','history']; // 자동갱신 시 재렌더 생략 (직접 fetch 탭)
function render(isAuto){
  renderKPI();
  renderKPICards();
  renderAlerts();
  if(isAuto && STATIC_TABS.indexOf(currentTab)>=0) return; // 예상/과거는 수동 전환 시에만 렌더
  var scrollY = window.scrollY;
  renderCurrentTab();
  window.scrollTo(0, scrollY);
}

function renderCurrentTab(){
  if(currentTab==='waiting') renderWaiting();
  else if(currentTab==='shipped') renderShipped();
  else if(currentTab==='overview') renderOverview();
  else if(currentTab==='closing') renderClosing();
  else if(currentTab==='courier') renderCourierTab();
  else if(currentTab==='pharma') renderPharmaTab();
  else if(currentTab==='summary') renderStatTab();
  else if(currentTab==='expect') renderExpect();
  else if(currentTab==='history') renderHistory();
  else renderWaiting();
}

/* 탭 뱃지 숫자 갱신 */
function renderKPICards(){
  var totalWait=0, totalShip=0, totalClose=0;
  ALL_FLOORS.forEach(function(f){
    (waiting[f]||[]).forEach(function(){ totalWait++; });
    if(doneStatus[f]) totalClose++;
  });
  Object.keys(shipments).forEach(function(k){
    var e=shipments[k];
    if(e&&e.pallets) e.pallets.forEach(function(){ totalShip++; });
  });
  document.getElementById('waitingCntBadge').textContent=totalWait;
  document.getElementById('shippedCntBadge').textContent=totalShip;
  document.getElementById('closeBadge').textContent=totalClose;
}

/* 마감 알림 */
function renderAlerts(){
  var list=[];
  if(notifications&&typeof notifications==='object'){
    Object.keys(notifications).forEach(function(f){
      var n=notifications[f];
      if(n&&n.type==='closing') list.push(n);
    });
  }
  var bar=document.getElementById('alertBar');
  if(list.length===0){bar.style.display='none';return;}
  bar.style.display='flex';
  bar.innerHTML='<span style="font-size:12px;font-weight:800;color:var(--a3);flex-shrink:0;">🏁 마감완료:</span>'
    +list.map(function(n){
      var t=n.closedAt?new Date(n.closedAt):null;
      var ts=t?String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'):'';
      return '<div class="alert-chip"><span style="background:'+FCOLORS[n.floor]+';color:#fff;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:900;">'+FN[n.floor]+'</span>'
        +'<span>'+n.worker+'</span>'
        +'<span style="color:var(--muted);">'+n.totalPlt+'PLT·'+n.totalBox+'BOX</span>'
        +(ts?'<span style="color:var(--muted);font-size:10px;">'+ts+'</span>':'')
        +'</div>';
    }).join('');
}

/* 파레트 카드 생성 */
function makePltCard(p, status, fbKey){
  var c = cfg.couriers.find(function(x){return x.id===p.courierId;})||{color:'#555',icon:'📦',name:p.courierId||''};
  var isShipped = status==='shipped';

  var card = document.createElement('div');
  card.className = 'plt-card ' + status;

  // 상단
  var top = document.createElement('div'); top.className='plt-card-top';
  var no = document.createElement('div'); no.className='plt-no '+status; no.textContent='No.'+p.pltNo;
  var cTag = document.createElement('div'); cTag.className='plt-c-tag'; cTag.style.background=c.color; cTag.textContent=c.icon+' '+c.name;
  var stTag = document.createElement('div'); stTag.className='plt-status-tag '+status;
  stTag.textContent = isShipped ? '✅출고' : '⏳대기';
  top.appendChild(no); top.appendChild(cTag); top.appendChild(stTag);
  card.appendChild(top);

  // 층 태그 (대기/출고 모두) + 엘베/시간 태그 (출고완료만)
  if(p.floor){
    var tagRow = document.createElement('div');
    tagRow.style.cssText='display:flex;gap:0;align-items:stretch;';
    var flTag = document.createElement('div');
    flTag.style.cssText='padding:2px 9px;font-size:9px;font-weight:700;color:#fff;background:'+FCOLORS[p.floor]+';';
    flTag.textContent = FN[p.floor]||p.floor;
    tagRow.appendChild(flTag);
    if(isShipped && ELEVATORS[p.elevator]){
      var evTag = document.createElement('div');
      evTag.style.cssText='padding:2px 9px;font-size:9px;font-weight:800;color:#fff;background:'+(ELEV_COLOR[p.elevator]||'#555')+';';
      evTag.textContent = (ELEV_EMOJI[p.elevator]||'🛗')+' '+ELEVATORS[p.elevator];
      tagRow.appendChild(evTag);
    }
    if(isShipped && p.sentAt){
      var tm=new Date(p.sentAt);
      var tmTag=document.createElement('div');
      tmTag.style.cssText='padding:2px 9px;font-size:9px;font-weight:800;color:#fff;background:#64748b;margin-left:auto;';
      tmTag.textContent='🕐 '+pad(tm.getHours())+':'+pad(tm.getMinutes());
      tagRow.appendChild(tmTag);
    }
    card.appendChild(tagRow);
  }

  // SVG
  var vis = document.createElement('div'); vis.className='plt-visual';
  vis.innerHTML = makeSVG(c.color, isShipped);
  card.appendChild(vis);

  // 하단 정보
  var bot = document.createElement('div'); bot.className='plt-bot';
  var tot = document.createElement('div'); tot.className='plt-tot';
  tot.style.color = isShipped ? 'var(--shipped)' : 'var(--text)';
  tot.innerHTML = '<strong>'+p.totalBox+'</strong>BOX';
  bot.appendChild(tot);
  var det = document.createElement('div'); det.className='plt-detail';
  (p.items||[]).forEach(function(it){
    var row = document.createElement('div');
    row.innerHTML = it.pharma+'<span class="plt-detail-box"> '+it.box+'박스</span>';
    det.appendChild(row);
  });
  bot.appendChild(det);
  card.appendChild(bot);

  // 카드 클릭 → 상세 팝업
  var pCopy=p, sCopy=status, kCopy=fbKey;
  card.addEventListener('click', function(){ showPltDetail(pCopy, sCopy, kCopy); });

  return card;
}

/* 대기중 렌더 */
function renderWaiting(){
  var container = document.getElementById('waitingContent');
  var allPallets = [];
  ALL_FLOORS.forEach(function(f){
    if(floorFilter!=='all'&&f!==floorFilter) return;
    (waiting[f]||[]).forEach(function(p){ allPallets.push(Object.assign({},p,{floor:f})); });
  });
  allPallets.sort(function(a,b){ return ALL_FLOORS.indexOf(a.floor)-ALL_FLOORS.indexOf(b.floor)||a.pltNo-b.pltNo; });

  var secTitle = '<div class="sec-title waiting-title">⏳ 대기중인 파레트 <span class="sec-cnt">'+allPallets.length+'개 · '+allPallets.reduce(function(s,p){return s+p.totalBox;},0)+'BOX</span></div>';

  if(allPallets.length===0){
    container.innerHTML=secTitle+'<div style="text-align:center;padding:40px;color:var(--muted);">대기중인 파레트가 없습니다</div>';
    return;
  }

  if(viewMode==='card'){
    container.innerHTML = secTitle;
    var grid = document.createElement('div'); grid.className='plt-grid';
    allPallets.forEach(function(p){ grid.appendChild(makePltCard(p,'waiting',null)); });
    container.appendChild(grid);
  } else {
    // 텍스트 뷰
    container.innerHTML = secTitle + makeTextTable(allPallets, 'waiting');
  }
}

/* 출고완료 렌더 */
function renderShipped(){
  var container = document.getElementById('shippedContent');
  var allPallets = [];
  Object.keys(shipments).forEach(function(key){
    var entry = shipments[key];
    if(!entry||!entry.pallets) return;
    if(floorFilter!=='all'&&entry.floor!==floorFilter) return;
    entry.pallets.forEach(function(p){
      allPallets.push(Object.assign({},p,{floor:entry.floor, fbKey:key, sentAt:entry.sentAt, worker:entry.worker, elevator:entry.elevator}));
    });
  });
  allPallets.sort(function(a,b){ return ALL_FLOORS.indexOf(a.floor)-ALL_FLOORS.indexOf(b.floor)||a.pltNo-b.pltNo; });

  var secTitle = '<div class="sec-title shipped-title">✅ 출고완료 파레트 <span class="sec-cnt">'+allPallets.length+'개 · '+allPallets.reduce(function(s,p){return s+p.totalBox;},0)+'BOX</span></div>';

  if(allPallets.length===0){
    container.innerHTML=secTitle+'<div style="text-align:center;padding:40px;color:var(--muted);">출고완료 파레트가 없습니다</div>';
    return;
  }

  // 출고 시간(분 단위)별로 그룹핑 — 같은 시간대에 나간 파레트끼리 묶음
  var groups={};
  allPallets.forEach(function(p){
    var t=p.sentAt?new Date(p.sentAt):null;
    var key=t?(pad(t.getHours())+':'+pad(t.getMinutes())):'시간미상';
    if(!groups[key])groups[key]={ts:t?t.getTime():0,list:[]};
    groups[key].list.push(p);
  });
  // 빨리 출고한 순서대로 (오래된→최신, 위가 먼저 나간 것)
  var gkeys=Object.keys(groups).sort(function(a,b){return groups[a].ts-groups[b].ts;});

  // 엘베 표시 순서
  var elevOrder=['office','inbound'];
  function elevKeyOf(p){ return ELEVATORS[p.elevator]?p.elevator:'etc'; }

  container.innerHTML=secTitle;
  gkeys.forEach(function(key){
    var g=groups[key];
    var gp=g.list;
    var gBox=gp.reduce(function(s,p){return s+(p.totalBox||0);},0);
    // 시간 그룹 헤더
    var hdr=document.createElement('div');
    hdr.style.cssText='display:flex;align-items:center;gap:8px;margin:16px 0 8px;padding:7px 12px;background:rgba(46,204,113,.08);border-left:4px solid var(--shipped);border-radius:6px;';
    hdr.innerHTML='<span style="font-size:14px;font-weight:900;color:var(--shipped);">🕐 '+key+' 출고</span>'
      +'<span style="font-size:11px;color:var(--muted);font-weight:700;">'+gp.length+'PLT · '+gBox+'BOX</span>';
    container.appendChild(hdr);

    // 엘베별 소분류
    var byElev={};
    gp.forEach(function(p){var ek=elevKeyOf(p);(byElev[ek]=byElev[ek]||[]).push(p);});
    var eks=elevOrder.filter(function(e){return byElev[e];});
    if(byElev['etc'])eks.push('etc');
    eks.forEach(function(ek){
      var list=byElev[ek];
      list.sort(function(a,b){return ALL_FLOORS.indexOf(a.floor)-ALL_FLOORS.indexOf(b.floor)||a.pltNo-b.pltNo;});
      var eBox=list.reduce(function(s,p){return s+(p.totalBox||0);},0);
      var ename=ek==='etc'?'엘베 미지정':ELEVATORS[ek];
      var ecolor=ek==='etc'?'#888':(ELEV_COLOR[ek]||'#555');
      var eemoji=ek==='etc'?'🛗':(ELEV_EMOJI[ek]||'🛗');
      var sub=document.createElement('div');
      sub.style.cssText='display:flex;align-items:center;gap:7px;margin:8px 0 6px;padding:4px 10px;border-left:3px solid '+ecolor+';';
      sub.innerHTML='<span style="background:'+ecolor+';color:#fff;border-radius:5px;padding:2px 9px;font-size:11px;font-weight:800;">'+eemoji+' '+ename+'</span>'
        +'<span style="font-size:11px;color:var(--muted);font-weight:700;">'+list.length+'PLT · '+eBox+'BOX</span>';
      container.appendChild(sub);
      if(viewMode==='card'){
        var grid=document.createElement('div'); grid.className='plt-grid';
        list.forEach(function(p){ grid.appendChild(makePltCard(p,'shipped',p.fbKey)); });
        container.appendChild(grid);
      } else {
        var wrap=document.createElement('div');
        wrap.innerHTML=makeShippedTextTable(list);
        container.appendChild(wrap);
      }
    });
  });
}

/* 텍스트 테이블 - 대기 */
function makeTextTable(pallets, status){
  var isShipped = status==='shipped';
  var rows='';
  var totBox=0;
  pallets.forEach(function(p){
    var c=cfg.couriers.find(function(x){return x.id===p.courierId;})||{name:p.courierId,color:'#555',icon:'📦'};
    var t=p.sentAt?new Date(p.sentAt):null;
    var ts=t?String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'):'';
    (p.items||[]).forEach(function(it,i){
      rows+='<tr>';
      if(i===0){
        rows+='<td rowspan="'+p.items.length+'" style="text-align:center"><span style="background:'+FCOLORS[p.floor]+';color:#fff;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:900">'+FN[p.floor]+'</span></td>';
        rows+='<td rowspan="'+p.items.length+'" style="text-align:center"><span style="background:var(--a5);color:#000;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:900">No.'+p.pltNo+'</span></td>';
        rows+='<td rowspan="'+p.items.length+'" style="text-align:center"><span style="background:'+c.color+';color:#fff;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:700">'+c.icon+' '+c.name+'</span></td>';
        rows+='<td rowspan="'+p.items.length+'" style="text-align:center"><span class="status-pill '+status+'">'+(isShipped?'✅출고':'⏳대기')+'</span></td>';
      }
      rows+='<td>'+it.pharma+'</td>';
      rows+='<td style="text-align:center;font-weight:700">'+it.box+'</td>';
      if(i===0){
        rows+='<td rowspan="'+p.items.length+'" style="text-align:center;font-weight:900;color:'+(isShipped?'var(--shipped)':'var(--waiting)')+'">'+p.totalBox+'</td>';
        if(isShipped){
          rows+='<td rowspan="'+p.items.length+'" style="text-align:center;font-size:10px;color:var(--muted)">'+ts+'</td>';
          var ev = ELEVATORS[p.elevator] ? '<span style="background:'+(ELEV_COLOR[p.elevator]||'#555')+';color:#fff;border-radius:5px;padding:2px 6px;font-size:10px;font-weight:800">'+(ELEV_EMOJI[p.elevator]||'🛗')+' '+ELEVATORS[p.elevator]+'</span>' : '<span style="color:var(--muted)">-</span>';
          rows+='<td rowspan="'+p.items.length+'" style="text-align:center">'+ev+'</td>';
        }
      }
      rows+='</tr>';
      totBox+=it.box;
    });
    totBox=0;
  });
  var cols = isShipped ? '<th>층</th><th>PLT</th><th>택배사</th><th>상태</th><th>제약사</th><th>BOX</th><th>총BOX</th><th>시간</th><th>엘베</th>'
                       : '<th>층</th><th>PLT</th><th>택배사</th><th>상태</th><th>제약사</th><th>BOX</th><th>총BOX</th>';
  return '<div class="tbl-wrap"><table><thead><tr>'+cols+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function makeShippedTextTable(pallets){
  return makeTextTable(pallets,'shipped');
}

/* 층별 현황 */
function renderOverview(){
  var container = document.getElementById('overviewContent');

      +'<div class="floor-badge" style="background:'+FCOLORS[floor]+'">'+FN[floor]+'</div>'

/* 되돌리기 */
async function returnToWaiting(fbKey, floor, pltNo){
  if(!confirm(FN[floor]+' No.'+pltNo+'\n대기로 되돌리겠습니까?')) return;
  try{
    // 해당 shipment 가져오기
    var r = await fetch(FB_URL+'/shipments/'+fbKey+'.json');
    var entry = await r.json();
    if(!entry||!entry.pallets){ alert('데이터를 찾을 수 없습니다'); return; }

    // waiting에 추가
    var r2 = await fetch(FB_URL+'/waiting.json');
    var wd = await r2.json();
    var wData = (wd&&wd.data) ? wd.data : {};
    if(!wData[floor]) wData[floor]=[];
    entry.pallets.forEach(function(p){ wData[floor].push(p); });
    await fetch(FB_URL+'/waiting.json',{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data:wData, updatedAt:new Date().toISOString(), doneStatus:wd?wd.doneStatus||{}:{}})
    });

    // shipment 삭제
    await fetch(FB_URL+'/shipments/'+fbKey+'.json',{method:'DELETE'});

    alert('✅ '+FN[floor]+' 대기로 복귀됐습니다!');
    loadData();
  } catch(e){ alert('오류: '+e.message); }
}

function renderClosing(){

/* 제약사별 현황 — 대기+출고 박스를 제약사로 묶어 표시 */
function renderPharmaTab(){
  var container=document.getElementById('pharmaContent');
  if(!container)return;
  var pmap={};
  function add(p,floor,status){
    (p.items||[]).forEach(function(it){
      if(!pmap[it.pharma]) pmap[it.pharma]={name:it.pharma,wait:0,ship:0,rows:[]};
      if(status==='ship') pmap[it.pharma].ship+=it.box; else pmap[it.pharma].wait+=it.box;
      pmap[it.pharma].rows.push({pltNo:p.pltNo,floor:floor,box:it.box,courierId:p.courierId,status:status});
    });
  }
  ALL_FLOORS.forEach(function(f){ (waiting[f]||[]).forEach(function(p){ add(p,f,'wait'); }); });
  Object.keys(shipments||{}).forEach(function(k){ var e=shipments[k]; if(e&&e.pallets) e.pallets.forEach(function(p){ add(p,e.floor,'ship'); }); });
  var names=Object.keys(pmap).sort();
  if(names.length===0){ container.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted);">💊 표시할 데이터가 없습니다</div>'; return; }
  var html='';
  names.forEach(function(pname){
    var pm=pmap[pname], tot=pm.wait+pm.ship;
    pm.rows.sort(function(a,b){return ALL_FLOORS.indexOf(a.floor)-ALL_FLOORS.indexOf(b.floor)||a.pltNo-b.pltNo;});
    html+='<div class="tbl-wrap" style="margin-bottom:14px;border-top:3px solid var(--a4);">'
      +'<div class="tbl-title">💊 '+pname
      +' <span style="float:right;font-weight:800;">⏳'+pm.wait+' · ✅'+pm.ship+' · 합 '+tot+'BOX</span></div>'
      +'<div style="padding:8px 12px;">'
      +pm.rows.map(function(r){
        var c=cfg.couriers.find(function(x){return x.id===r.courierId;})||{color:'#555',icon:'📦',name:r.courierId||''};
        return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);">'
          +'<span style="background:'+FCOLORS[r.floor]+';color:#fff;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:900;flex-shrink:0;">'+FN[r.floor]+'</span>'
          +'<span style="font-weight:800;flex-shrink:0;">No.'+r.pltNo+'</span>'
          +'<span style="flex:1;font-size:12px;color:'+c.color+';font-weight:700;">'+c.icon+' '+c.name+'</span>'
          +'<span style="font-weight:900;flex-shrink:0;">'+r.box+'박스</span>'
          +'<span style="flex-shrink:0;font-size:11px;font-weight:800;color:'+(r.status==='ship'?'var(--shipped)':'var(--waiting)')+';">'+(r.status==='ship'?'✅':'⏳')+'</span>'
        +'</div>';
      }).join('')
      +'</div></div>';
  });
  container.innerHTML=html;
}

function renderExpect(){
  var container=document.getElementById('expectContent');
  if(!container)return;
  fetch(FB_URL+'/expect.json?t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.data||!Object.keys(d.data).some(function(k){return d.data[k]>0;})){
        container.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px;">📋 예상 데이터가 없습니다<br><small>출고지기 작업 앱 예상 탭에서 입력해주세요</small></div>';return;
      }
      expectData=d.data||{};
      var expStatus=d.status||{};
      var confFloors=ALL_FLOORS.filter(function(f){return expStatus[f]&&expStatus[f].state==='confirmed';});
      var totalExp=0,totalAct=0;
      Object.keys(expectData).forEach(function(k){totalExp+=expectData[k]||0;});
      ALL_FLOORS.forEach(function(f){(waiting[f]||[]).forEach(function(){totalAct++;});Object.keys(shipments||{}).forEach(function(k){var e=shipments[k];if(e&&e.floor===f&&e.pallets)totalAct+=e.pallets.length;});});
      var pct=totalExp>0?Math.round(totalAct/totalExp*100):0;
      var html='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">'
        +'<div class="kpi" style="border-top:3px solid var(--a4)"><div class="kpi-icon">📋</div><div class="kpi-label">총 예상</div><div class="kpi-val" style="color:var(--a4)">'+totalExp+'</div><div class="kpi-sub">파레트</div></div>'
        +'<div class="kpi" style="border-top:3px solid var(--a3)"><div class="kpi-icon">✅</div><div class="kpi-label">실제 처리</div><div class="kpi-val" style="color:var(--a3)">'+totalAct+'</div><div class="kpi-sub">파레트</div></div>'
        +'<div class="kpi" style="border-top:3px solid var(--a1)"><div class="kpi-icon">📊</div><div class="kpi-label">달성률</div><div class="kpi-val" style="color:'+(pct>=100?'var(--a3)':pct>=50?'var(--a5)':'var(--red)')+'">'+pct+'%</div><div class="kpi-sub">예상 대비</div></div>'
        +'</div>';
      html+='<div style="background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-bottom:14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
        +'<span style="color:var(--muted)">확정 상태:</span>'
        +(confFloors.length?confFloors.map(function(f){return '<span style="background:var(--shipped);color:#053;border-radius:5px;padding:2px 8px;font-weight:900;">🟢 '+FN[f]+' 확정</span>';}).join(' '):'<span style="color:var(--waiting)">아직 확정된 층 없음 (전부 예상중)</span>')
        +'<span style="margin-left:auto;color:var(--muted);font-size:11px;">확정 '+confFloors.length+' / '+ALL_FLOORS.length+'층</span></div>';
      html+='<div class="tbl-wrap"><div class="tbl-title">🏢 층별 × 택배사 예상 vs 실제</div><table><thead><tr><th>층</th>';
      cfg.couriers.forEach(function(c){html+='<th colspan="2" style="text-align:center;background:'+c.color+'22;color:'+c.color+';">'+c.icon+' '+c.name+'</th>';});
      html+='<th colspan="2" style="text-align:center">합계</th></tr><tr><th></th>';
      cfg.couriers.forEach(function(){html+='<th style="font-size:10px;color:var(--a4)">예상</th><th style="font-size:10px;color:var(--a3)">실제</th>';});
      html+='<th style="font-size:10px;color:var(--a4)">예상</th><th style="font-size:10px;color:var(--a3)">실제</th></tr></thead><tbody>';
      var grandExp=0,grandAct=0;
      ALL_FLOORS.forEach(function(floor){
        var actByC={};cfg.couriers.forEach(function(c){actByC[c.id]=0;});
        (waiting[floor]||[]).forEach(function(p){if(actByC[p.courierId]!==undefined)actByC[p.courierId]++;});
        Object.keys(shipments||{}).forEach(function(k){var e=shipments[k];if(e&&e.floor===floor&&e.pallets)e.pallets.forEach(function(p){if(actByC[p.courierId]!==undefined)actByC[p.courierId]++;});});
        var fExp=0,fAct=0;
        var stConf=expStatus[floor]&&expStatus[floor].state==='confirmed';
        var stBadge=stConf?'<span style="display:inline-block;margin-left:5px;background:var(--shipped);color:#053;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:900;">🟢확정</span>':'<span style="display:inline-block;margin-left:5px;background:var(--waiting);color:#5a2d00;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:800;">🟡예상중</span>';
        html+='<tr><td style="white-space:nowrap"><span style="background:'+FCOLORS[floor]+';color:#fff;border-radius:5px;padding:3px 8px;font-size:12px;font-weight:900;">'+FN[floor]+'</span>'+stBadge+'</td>';
        cfg.couriers.forEach(function(c){
          var exp=expectData[floor+'_'+c.id]||0,act=actByC[c.id]||0,diff=act-exp;
          html+='<td style="text-align:center;color:var(--a4);font-weight:700;">'+(exp>0?exp:'-')+'</td>';
          html+='<td style="text-align:center;font-weight:800;color:var(--a3);">'+act+(exp>0?'<span style="font-size:9px;color:'+(diff>=0?'var(--a3)':'var(--red)')+';margin-left:2px;">'+(diff>=0?'+':'')+diff+'</span>':'')+'</td>';
          fExp+=exp;fAct+=act;
        });
        html+='<td style="text-align:center;color:var(--a4);font-weight:800;">'+(fExp>0?fExp:'-')+'</td>';
        html+='<td style="text-align:center;font-weight:900;color:var(--a3);">'+fAct+'</td></tr>';
        grandExp+=fExp;grandAct+=fAct;
      });
      html+='</tbody><tfoot><tr><td>합계</td>';
      cfg.couriers.forEach(function(c){
        var totE=0,totA=0;ALL_FLOORS.forEach(function(f){totE+=expectData[f+'_'+c.id]||0;(waiting[f]||[]).forEach(function(p){if(p.courierId===c.id)totA++;});Object.keys(shipments||{}).forEach(function(k){var e=shipments[k];if(e&&e.floor===f&&e.pallets)e.pallets.forEach(function(p){if(p.courierId===c.id)totA++;});});});
        html+='<td style="text-align:center;color:var(--a4);font-weight:800;">'+(totE>0?totE:'-')+'</td><td style="text-align:center;font-weight:900;color:var(--a3);">'+totA+'</td>';
      });
      html+='<td style="text-align:center;color:var(--a4);font-weight:900;">'+(grandExp>0?grandExp:'-')+'</td><td style="text-align:center;font-weight:900;color:var(--a3);">'+grandAct+'</td></tr></tfoot></table></div>';
      if(d.worker)html+='<div style="text-align:right;font-size:11px;color:var(--muted);margin-top:8px;">입력: '+d.worker+'</div>';
      container.innerHTML=html;
    })
    .catch(function(){container.innerHTML='<div style="text-align:center;padding:40px;color:var(--red);">로드 실패</div>';});
}

function renderKPI(){

  ALL_FLOORS.forEach(function(f){(waiting[f]||[]).forEach(function(p){wp++;wb+=p.totalBox||0;});});
  Object.keys(shipments).forEach(function(k){var e=shipments[k];if(e&&e.pallets)e.pallets.forEach(function(p){sp++;sb+=p.totalBox||0;});});
  var doneCnt=ALL_FLOORS.filter(function(f){return doneStatus[f];}).length;
  var kpis=[
    {icon:'⏳',label:'대기중',val:wp+'PLT',sub:wb+'BOX',col:'var(--waiting)',action:function(){switchTab('waiting');setFloor('all',document.querySelector('[data-floor="all"]'));}},
    {icon:'✅',label:'출고완료',val:sp+'PLT',sub:sb+'BOX',col:'var(--shipped)',action:function(){switchTab('shipped');}},
    {icon:'📦',label:'총 BOX',val:wb+sb,sub:'대기+출고',col:'var(--a1)',action:function(){switchTab('summary');}},
    {icon:'🏁',label:'마감완료',val:doneCnt+'/'+ALL_FLOORS.length+'층',sub:'',col:'var(--a4)',action:function(){switchTab('closing');}},
  ];
  cfg.couriers.forEach(function(c){
    var cw=0,cwb=0,cs=0,csb=0;
    ALL_FLOORS.forEach(function(f){(waiting[f]||[]).forEach(function(p){if(p.courierId===c.id){cw++;cwb+=p.totalBox||0;}});});
    Object.keys(shipments).forEach(function(k){var e=shipments[k];if(e&&e.pallets)e.pallets.forEach(function(p){if(p.courierId===c.id){cs++;csb+=p.totalBox||0;}});});
    (function(courier){
      kpis.push({icon:courier.icon,label:courier.name,val:'⏳'+cw+' / ✅'+cs,sub:'BOX '+(cwb+csb),col:courier.color,twoLine:true,

        +'<div style="font-size:18px;margin-bottom:4px;">'+k.icon+'</div>'
        +'<div style="font-size:10px;color:var(--muted);font-weight:600;margin-bottom:5px;">'+k.label+'</div>'
        +'<div style="display:flex;gap:6px;align-items:center;">'
          +'<div style="text-align:center;flex:1;"><div style="font-size:10px;color:var(--waiting);font-weight:700;">⏳대기</div><div style="font-size:20px;font-weight:900;color:var(--waiting);">'+(parts[0]?parts[0].replace('⏳',''):'0')+'</div></div>'
          +'<div style="width:1px;height:32px;background:var(--border);"></div>'
          +'<div style="text-align:center;flex:1;"><div style="font-size:10px;color:var(--shipped);font-weight:700;">✅출고</div><div style="font-size:20px;font-weight:900;color:var(--shipped);">'+(parts[1]?parts[1].replace('✅',''):'0')+'</div></div>'
        +'</div>'
        +'<div style="font-size:10px;color:var(--muted);margin-top:4px;">'+k.sub+'</div>'
      +'</div>';
    } else {
      html+='<div style="'+baseStyle+'" onclick="(kpiActions['+i+'])()">'
        +'<div style="font-size:18px;margin-bottom:4px;">'+k.icon+'</div>'
        +'<div style="font-size:10px;color:var(--muted);font-weight:600;margin-bottom:3px;">'+k.label+'</div>'

/* 택배사 상세 팝업 */
function showCourierDetail(courier){
  var waitPallets=[], shipPallets=[];
  ALL_FLOORS.forEach(function(f){
    (waiting[f]||[]).forEach(function(p){if(p.courierId===courier.id) waitPallets.push(Object.assign({},p,{floor:f}));});
  });
  Object.keys(shipments).forEach(function(k){
    var e=shipments[k];if(e&&e.pallets)e.pallets.forEach(function(p){if(p.courierId===courier.id) shipPallets.push(Object.assign({},p,{floor:e.floor,sentAt:e.sentAt,elevator:e.elevator,fbKey:k}));});
  });
  var totalWB=waitPallets.reduce(function(s,p){return s+p.totalBox;},0);
  var totalSB=shipPallets.reduce(function(s,p){return s+p.totalBox;},0);
  var html='<div class="plt-modal-hdr" style="background:'+courier.color+'22;border-bottom:3px solid '+courier.color+';">'
    +'<div style="background:'+courier.color+';color:#fff;border-radius:8px;padding:5px 14px;font-size:14px;font-weight:900;">'+courier.icon+' '+courier.name+'</div>'
    +'<div style="margin-left:auto;font-size:12px;color:var(--muted);">⏳'+waitPallets.length+' / ✅'+shipPallets.length+'PLT</div>'
    +'</div><div class="plt-modal-body">';
  if(waitPallets.length>0){
    html+='<div style="font-size:11px;color:var(--waiting);font-weight:800;margin-bottom:6px;">⏳ 대기중 '+waitPallets.length+'PLT · '+totalWB+'BOX</div>';
    waitPallets.sort(function(a,b){return ALL_FLOORS.indexOf(a.floor)-ALL_FLOORS.indexOf(b.floor)||a.pltNo-b.pltNo;}).forEach(function(p){
      html+='<div class="plt-modal-item" style="background:var(--card2);margin-bottom:3px;cursor:pointer;" onclick="closeCourierModal();showPltDetail('+JSON.stringify(p)+',\'waiting\',null);">'
        +'<span><span style="background:'+FCOLORS[p.floor]+';color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;margin-right:6px;">'+FN[p.floor]+'</span>No.'+p.pltNo+'</span>'
        +'<span style="font-weight:900;color:var(--waiting);">'+p.totalBox+'BOX</span></div>';
    });
  }
  if(shipPallets.length>0){
    html+='<div style="font-size:11px;color:var(--shipped);font-weight:800;margin:10px 0 6px;">✅ 출고완료 '+shipPallets.length+'PLT · '+totalSB+'BOX</div>';
    shipPallets.sort(function(a,b){return ALL_FLOORS.indexOf(a.floor)-ALL_FLOORS.indexOf(b.floor)||a.pltNo-b.pltNo;}).forEach(function(p){
      var t=p.sentAt?new Date(p.sentAt):null;var ts=t?pad(t.getHours())+':'+pad(t.getMinutes()):'';
      html+='<div class="plt-modal-item" style="background:rgba(46,204,113,.06);margin-bottom:3px;cursor:pointer;" onclick="closeCourierModal();showPltDetail('+JSON.stringify(p)+',\'shipped\',\''+p.fbKey+'\');">'
        +'<span><span style="background:'+FCOLORS[p.floor]+';color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;margin-right:6px;">'+FN[p.floor]+'</span>No.'+p.pltNo+'</span>'
        +'<span style="font-size:11px;color:var(--muted);">'+(ts?'🕐 '+ts:'')+'</span>'
        +'<span style="font-weight:900;color:var(--shipped);">'+p.totalBox+'BOX</span></div>';
    });
  }
  if(waitPallets.length===0&&shipPallets.length===0) html+='<div style="text-align:center;padding:20px;color:var(--muted);">해당 택배사 파레트 없음</div>';
  html+='<button class="plt-modal-close" onclick="closeCourierModal()">닫기</button></div>';
  document.getElementById('pltDetailModal').innerHTML=html;
  document.getElementById('pltDetailOverlay').classList.add('show');
}

function getDayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function manualDailyReset(){
  if(!confirm('오늘 업무를 마감하고 새 작업을 시작할까요?\n\n✅ 상세 데이터 보관 후 전체 초기화')) return;
  if(!confirm('⚠️ 실수 방지 재확인\n\n정말 전체 초기화할까요?\n모든 대기·출고·마감 데이터가 비워집니다.\n(자동저장 백업에서 복구 가능)')) return;
  doDailyReset();
}

async function doDailyReset(){
  var today=getDayKey();
  try{
    var totalPlt=0,totalBox=0,byFloor={},byCourier={},allShipped=[];
    ALL_FLOORS.forEach(function(f){
      var wl=waiting[f]||[];
      var sl=[];Object.keys(shipments).forEach(function(k){var e=shipments[k];if(e&&e.floor===f&&e.pallets){sl=sl.concat(e.pallets);allShipped=allShipped.concat(e.pallets.map(function(p){return Object.assign({},p,{floor:f});}));}});
      var all=wl.concat(sl);
      byFloor[f]={plt:all.length,box:all.reduce(function(s,p){return s+(p.totalBox||0);},0),done:doneStatus[f]||false,waiting:wl.length,shipped:sl.length};
      all.forEach(function(p){
        if(!byCourier[p.courierId])byCourier[p.courierId]={plt:0,box:0,name:p.courierName,icon:p.courierIcon};
        byCourier[p.courierId].plt++;byCourier[p.courierId].box+=p.totalBox||0;
        totalPlt++;totalBox+=p.totalBox||0;
      });
    });
    var record={date:today,savedAt:new Date().toISOString(),totalPlt:totalPlt,totalBox:totalBox,byFloor:byFloor,byCourier:byCourier,pallets:allShipped};
    await fetch(FB_URL+'/history/'+today+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)});
    // 초기화 직전 상태를 백업에 저장(복구용)
    try{ var _hr=String(new Date().getHours()).padStart(2,'0'); await fetch(FB_URL+'/backups/'+today+'/'+_hr+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshotData())}); }catch(_e){}
    var empty={data:{},updatedAt:new Date().toISOString(),doneStatus:{}};
    ALL_FLOORS.forEach(function(f){empty.data[f]=[];});
    await Promise.all([
      fetch(FB_URL+'/waiting.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(empty)}),
      fetch(FB_URL+'/shipments.json',{method:'DELETE'}),
      fetch(FB_URL+'/notifications.json',{method:'DELETE'}),
      fetch(FB_URL+'/reports.json',{method:'DELETE'}),
    ]);
    await fetch(FB_URL+'/reset_signal.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:today,resetAt:new Date().toISOString(),by:'출고팀PC'})});
    lsSet('plt_mon_last_day', today);
    alert('✅ '+today+' 일일 마감 완료!\n데이터 보관됨\n전체 앱 새 작업 시작');
    waiting={};shipments={};doneStatus={};notifications={};closingReports={};reports={};
    render();
    switchTab('history');
  }catch(e){alert('오류: '+e.message);}
}

function saveTestHistory(){
  var today=getDayKey();
  var totalPlt=0,totalBox=0,byFloor={},byCourier={},allShipped=[];
  ALL_FLOORS.forEach(function(f){
    var wl=waiting[f]||[];
    var sl=[];Object.keys(shipments).forEach(function(k){var e=shipments[k];if(e&&e.floor===f&&e.pallets){sl=sl.concat(e.pallets);allShipped=allShipped.concat(e.pallets.map(function(p){return Object.assign({},p,{floor:f});}));}});
    var all=wl.concat(sl);
    byFloor[f]={plt:all.length,box:all.reduce(function(s,p){return s+(p.totalBox||0);},0),done:doneStatus[f]||false};
    all.forEach(function(p){
      if(!byCourier[p.courierId])byCourier[p.courierId]={plt:0,box:0};
      byCourier[p.courierId].plt++;byCourier[p.courierId].box+=p.totalBox||0;
      totalPlt++;totalBox+=p.totalBox||0;
    });
  });
  var record={date:today,savedAt:new Date().toISOString(),totalPlt:totalPlt,totalBox:totalBox,byFloor:byFloor,byCourier:byCourier,pallets:allShipped};
  fetch(FB_URL+'/history/'+today+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)})
    .then(function(){alert('✅ 저장됨!');renderHistory();})
    .catch(function(e){alert('실패: '+e.message);});
}

/* ── 과거데이터 불러오기 ── */

function renderHistory(){
  var container=document.getElementById('historyContent');
  if(!container)return;
  container.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted)">📅 로딩 중...</div>';

  // shallow=true로 날짜 키 목록만 먼저 가져오기
  fetch(FB_URL+'/history.json?shallow=true&t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(keys){
      if(!keys||typeof keys!=='object'||Object.keys(keys).length===0){
        container.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px;">저장된 과거 데이터가 없습니다<br><small>일일 마감 후 여기서 조회할 수 있습니다</small><br><br>'
          +'<button onclick="saveTestHistory()" style="background:rgba(46,204,113,.1);border:1.5px solid rgba(46,204,113,.3);color:var(--a3);border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">🧪 현재 데이터로 테스트 저장</button>'
          +'</div>';
        return Promise.resolve([]);
      }
      // 날짜별 상세 데이터 개별 fetch
      var dateKeys=Object.keys(keys).sort().reverse();
      return Promise.all(dateKeys.map(function(date){
        return fetch(FB_URL+'/history/'+date+'.json?t='+Date.now())
          .then(function(r){return r.json();})
          .then(function(rec){return {date:date,rec:rec};})
          .catch(function(){return {date:date,rec:null};});
      }));
    })
    .then(function(results){
      if(!results||results.length===0)return;
      var wrap=document.createElement('div');
      results.forEach(function(item){
        if(!item.rec)return;
        var date=item.date,rec=item.rec;
        var t=new Date(rec.savedAt||date);
        var ts=rec.savedAt?(pad(t.getHours())+':'+pad(t.getMinutes())):'';

        var card=document.createElement('div');
        card.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;';
        var hdr=document.createElement('div');
        hdr.style.cssText='padding:12px 16px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;';
        hdr.innerHTML='<span style="font-size:17px;font-weight:900;color:var(--a5);">📅 '+date+'</span>'
          +(ts?'<span style="font-size:12px;color:var(--muted);">마감 '+ts+'</span>':'')
          +'<span style="margin-left:auto;font-size:14px;font-weight:800;color:var(--a3);">'+(rec.totalPlt||0)+'PLT · '+(rec.totalBox||0)+'BOX</span>';
        card.appendChild(hdr);
        var body=document.createElement('div');
        body.style.cssText='padding:12px 16px;';

        // 층별
        if(rec.byFloor){
          var fg=document.createElement('div');
          fg.style.cssText='display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;';
          ALL_FLOORS.forEach(function(f){
            var fd=rec.byFloor[f];if(!fd)return;
            var fc2=document.createElement('div');
            fc2.style.cssText='background:var(--card2);border-radius:8px;padding:8px;text-align:center;border-top:3px solid '+FCOLORS[f]+';';
            fc2.innerHTML='<div style="font-size:10px;font-weight:800;color:'+FCOLORS[f]+';">'+FN[f]+'</div><div style="font-size:16px;font-weight:900;margin:3px 0;">'+(fd.plt||0)+'PLT</div><div style="font-size:10px;color:var(--muted);">'+(fd.box||0)+'BOX</div><div style="font-size:9px;color:'+(fd.done?'var(--a3)':'var(--a2)')+';">'+(fd.done?'✅마감':'⏳미완')+'</div>';
            fg.appendChild(fc2);
          });
          body.appendChild(fg);
        }

        // 택배사별
        if(rec.byCourier){
          var crow=document.createElement('div');
          crow.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;';
          cfg.couriers.forEach(function(c){
            var cd=rec.byCourier[c.id];if(!cd)return;
            var chip=document.createElement('div');
            chip.style.cssText='background:'+c.color+'20;border:1.5px solid '+c.color+'50;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;';
            chip.innerHTML=c.icon+' '+c.name+'<br><span style="font-size:13px;font-weight:900;color:'+c.color+'">'+(cd.plt||0)+'PLT·'+(cd.box||0)+'BOX</span>';
            crow.appendChild(chip);
          });
          body.appendChild(crow);
        }

        // 파레트 상세
        if(rec.pallets&&rec.pallets.length>0){
          var togBtn=document.createElement('button');
          togBtn.style.cssText='background:rgba(59,158,255,.12);border:1px solid rgba(59,158,255,.3);color:var(--a1);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;display:block;';
          togBtn.textContent='📋 파레트 상세 펼치기 ('+rec.pallets.length+'개)';
          var detWrap=document.createElement('div');
          detWrap.style.display='none';
          togBtn.addEventListener('click',function(){
            var open=detWrap.style.display!=='none';
            detWrap.style.display=open?'none':'block';
            togBtn.textContent=open?'📋 파레트 상세 펼치기 ('+rec.pallets.length+'개)':'📋 접기';
          });
          body.appendChild(togBtn);
          var tbl=document.createElement('table');
          tbl.style.cssText='width:100%;border-collapse:collapse;font-size:11px;';
          tbl.innerHTML='<thead><tr><th style="background:var(--card2);padding:6px 8px;border:1px solid var(--border);color:var(--muted);">층</th><th style="background:var(--card2);padding:6px 8px;border:1px solid var(--border);color:var(--muted);">PLT</th><th style="background:var(--card2);padding:6px 8px;border:1px solid var(--border);color:var(--muted);">택배사</th><th style="background:var(--card2);padding:6px 8px;border:1px solid var(--border);color:var(--muted);">제약사</th><th style="background:var(--card2);padding:6px 8px;border:1px solid var(--border);color:var(--muted);text-align:center;">BOX</th></tr></thead><tbody>';
          rec.pallets.slice().sort(function(a,b){return ALL_FLOORS.indexOf(a.floor)-ALL_FLOORS.indexOf(b.floor)||(a.pltNo-b.pltNo);}).forEach(function(p){
            var c2=cfg.couriers.find(function(x){return x.id===p.courierId;})||{name:p.courierName||'',color:'#555',icon:'📦'};
            (p.items||[]).forEach(function(it,ii){
              var row='<tr>';
              if(ii===0){row+='<td rowspan="'+p.items.length+'" style="padding:5px 8px;border:1px solid var(--border);text-align:center;"><span style="background:'+FCOLORS[p.floor]+';color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;">'+(FN[p.floor]||p.floor)+'</span></td><td rowspan="'+p.items.length+'" style="padding:5px 8px;border:1px solid var(--border);text-align:center;font-weight:900;color:var(--a5);">No.'+p.pltNo+'</td><td rowspan="'+p.items.length+'" style="padding:5px 8px;border:1px solid var(--border);"><span style="background:'+c2.color+';color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700;">'+c2.icon+' '+c2.name+'</span></td>';}
              row+='<td style="padding:5px 8px;border:1px solid var(--border);">'+(it.pharma||'')+'</td><td style="padding:5px 8px;border:1px solid var(--border);text-align:center;font-weight:700;">'+(it.box||0)+'</td></tr>';
              tbl.innerHTML+=row;
            });
          });
          tbl.innerHTML+='</tbody>';
          detWrap.appendChild(tbl);
          body.appendChild(detWrap);
        }

        var delBtn=document.createElement('button');
        delBtn.style.cssText='margin-top:10px;width:100%;background:rgba(239,68,68,.08);border:1.5px solid rgba(239,68,68,.2);color:var(--red);border-radius:8px;padding:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;';
        delBtn.textContent='🗑 '+date+' 데이터 삭제';
        (function(dt){delBtn.addEventListener('click',function(){if(confirm(dt+' 삭제?')){fetch(FB_URL+'/history/'+dt+'.json',{method:'DELETE'}).then(function(){renderHistory();});}});})(date);
        body.appendChild(delBtn);
        card.appendChild(body);
        wrap.appendChild(card);
      });
      container.innerHTML='';
      container.appendChild(wrap);
    })
    .catch(function(e){
      container.innerHTML='<div style="text-align:center;padding:40px;color:var(--red);">로드 실패: '+e.message+'<br><br><button onclick="renderHistory()" style="background:rgba(239,68,68,.1);border:1.5px solid rgba(239,68,68,.3);color:var(--red);border-radius:8px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">🔄 다시 시도</button></div>';
    });
}

/* ── 시간별 자동저장(복구용) ── */
function snapshotData(){
  return {savedAt:new Date().toISOString(), waiting:waiting, doneStatus:doneStatus, shipments:shipments, notifications:notifications, reports:reports};
}
function hasLiveData(){
  if(ALL_FLOORS.some(function(f){return (waiting[f]||[]).length>0;})) return true;
  return Object.keys(shipments||{}).length>0;
}
async function autosaveBackup(){
  if(!hasLiveData()) return;
  var d=new Date(); var dayKey=getDayKey(); var hour=String(d.getHours()).padStart(2,'0');
  try{
    await fetch(FB_URL+'/backups/'+dayKey+'/'+hour+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshotData())});
    lsSet('plt_mon_autosave_hour', dayKey+'_'+hour);
    pruneBackups();
  }catch(e){}
}
function checkAutosave(){
  var d=new Date(); var hk=getDayKey()+'_'+String(d.getHours()).padStart(2,'0');
  if(lsGet('plt_mon_autosave_hour')!==hk) autosaveBackup();
}
async function pruneBackups(){
  try{
    var r=await fetch(FB_URL+'/backups.json?shallow=true');
    var keys=await r.json(); if(!keys) return;
    var today=getDayKey();
    var yd=new Date(Date.now()-86400000); var yday=yd.getFullYear()+'-'+String(yd.getMonth()+1).padStart(2,'0')+'-'+String(yd.getDate()).padStart(2,'0');
    Object.keys(keys).forEach(function(k){ if(k!==today&&k!==yday) fetch(FB_URL+'/backups/'+k+'.json',{method:'DELETE'}); });
  }catch(e){}
}

/* ── 복구 UI ── */
async function openRecovery(){
  var ov=document.getElementById('recoveryOverlay'), box=document.getElementById('recoveryModal');
  box.innerHTML='<div style="padding:24px;text-align:center;color:var(--muted)">🛟 백업 불러오는 중...</div>';
  ov.classList.add('show');
  try{
    var r=await fetch(FB_URL+'/backups.json?t='+Date.now());
    var data=await r.json();
    var items=[];
    if(data) Object.keys(data).forEach(function(day){ var hrs=data[day]; if(!hrs)return; Object.keys(hrs).forEach(function(h){ items.push({day:day,hour:h,snap:hrs[h]}); }); });
    items.sort(function(a,b){ return (b.day+b.hour).localeCompare(a.day+a.hour); });
    var html='<div style="padding:18px;max-height:75vh;overflow:auto;">'
      +'<div style="font-size:17px;font-weight:900;margin-bottom:4px;">🛟 데이터 복구</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-bottom:16px;">시간별 자동저장 지점에서 복구합니다. 현재 데이터를 덮어씁니다.</div>';
    if(items.length===0){
      html+='<div style="text-align:center;padding:30px;color:var(--muted);">저장된 백업이 없습니다.<br><small>매시간 자동저장됩니다.</small></div>';
    } else {
      items.forEach(function(it){
        var s=it.snap||{}; var wc=0,sc=0;
        ALL_FLOORS.forEach(function(f){ wc+=((s.waiting||{})[f]||[]).length; });
        Object.keys(s.shipments||{}).forEach(function(k){ var e=s.shipments[k]; if(e&&e.pallets) sc+=e.pallets.length; });
        html+='<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;">'
          +'<div style="flex:1;"><div style="font-weight:800;font-size:13px;">📅 '+it.day+' '+it.hour+':00</div><div style="font-size:11px;color:var(--muted);">⏳대기 '+wc+'PLT · ✅출고 '+sc+'PLT</div></div>'
          +'<button onclick="restoreBackup(\''+it.day+'\',\''+it.hour+'\')" style="background:rgba(3,199,90,.12);border:1.5px solid rgba(3,199,90,.35);color:var(--a1);border-radius:7px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;">복구</button>'
          +'</div>';
      });
    }
    html+='<button onclick="closeRecovery()" style="width:100%;margin-top:8px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;">닫기</button></div>';
    box.innerHTML=html;
  }catch(e){ box.innerHTML='<div style="padding:24px;text-align:center;color:var(--red)">로드 실패: '+e.message+'</div>'; }
}
function closeRecovery(){ document.getElementById('recoveryOverlay').classList.remove('show'); }
async function restoreBackup(day,hour){
  if(!confirm('📅 '+day+' '+hour+':00 시점으로 복구할까요?\n현재 데이터를 덮어씁니다.')) return;
  if(!confirm('⚠️ 실수 방지 재확인\n정말 복구할까요? 현재 데이터는 사라집니다.')) return;
  try{
    var r=await fetch(FB_URL+'/backups/'+day+'/'+hour+'.json');
    var s=await r.json();
    if(!s){ alert('백업을 찾을 수 없습니다'); return; }
    var wt={data:s.waiting||{},doneStatus:s.doneStatus||{},updatedAt:new Date().toISOString()};
    await Promise.all([
      fetch(FB_URL+'/waiting.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(wt)}),
      fetch(FB_URL+'/shipments.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(s.shipments||{})}),
      fetch(FB_URL+'/notifications.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(s.notifications||{})}),
      fetch(FB_URL+'/reports.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(s.reports||{})})
    ]);
    closeRecovery();
    alert('✅ '+day+' '+hour+':00 시점으로 복구됐습니다.');
    loadData();
  }catch(e){ alert('복구 실패: '+e.message); }
}

/* ── 날짜 변경 시 첫 실행 새 작업 확인 ── */
var _newDayAsked=false;
function checkMonitorNewDay(){
  var today=getDayKey(), lastDay=lsGet('plt_mon_last_day');
  if(!lastDay){ lsSet('plt_mon_last_day', today); return; }
  if(lastDay!==today && !_newDayAsked){
    _newDayAsked=true;
    lsSet('plt_mon_last_day', today);
    if(confirm('📅 날짜가 바뀌었습니다.\n('+lastDay+' → '+today+')\n\n새로운 작업을 시작하시겠습니까?\n어제 데이터는 보관됩니다.')){
      if(confirm('⚠️ 실수 방지 재확인\n정말 전체 초기화할까요?')) doDailyReset();
    }
  }
}

loadData(false);
setInterval(function(){ loadData(true); }, 10000);
checkMonitorNewDay();
checkAutosave();
setInterval(checkAutosave, 60000);
</script>

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
(function(){
  if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
  var dp=null, btn=null;
  function mkBtn(){
    if(btn) return;
    btn=document.createElement('button');
    btn.textContent='📲 홈 화면에 앱 설치';
    btn.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:99999;padding:13px 22px;border:0;border-radius:999px;background:#111;color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer';
    btn.onclick=function(){ if(!dp) return; dp.prompt(); dp.userChoice.finally(function(){ dp=null; if(btn){btn.remove();btn=null;} }); };
    document.body.appendChild(btn);
  }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); dp=e; mkBtn(); });
  window.addEventListener('appinstalled', function(){ if(btn){btn.remove();btn=null;} });
})();
</script>
