<!DOCTYPE html>
<html lang="ko" class="theme-admin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>파레트 관리자</title>
<link rel="apple-touch-icon" href="icon-admin.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="파레트 관리">
<link rel="manifest" href="manifest-admin.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#6366F1">
<link rel="stylesheet" href="css/admin-theme.css">
<style>
:root{
  --bg:#F2F4F6;--card:#FFFFFF;--card2:#F9FAFB;--border:#E5E8EB;
  --text:#1A1A1A;--muted:#8C9EAA;
  --a1:#03C75A;--a2:#FF6B00;--a3:#00B900;--a4:#5046E5;--a5:#FFA800;--a6:#FF4F8B;
  --red:#FF3D3D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;min-height:100vh;}

.hdr{position:sticky;top:0;z-index:200;background:#FFFFFF;border-bottom:2px solid var(--a1);padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:15px;font-weight:900;color:var(--text);}
.hdr-sub{font-size:9px;color:var(--muted);margin-top:1px;}
.hdr-r{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--a3);box-shadow:0 0 6px var(--a3);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-time{font-size:10px;color:var(--muted);}
.refresh-fab{background:rgba(3,199,90,.1);border:1px solid rgba(3,199,90,.3);color:var(--a1);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;}

/* 탭 */
.tab-nav{position:sticky;top:58px;z-index:90;background:#FFFFFF;border-bottom:1px solid var(--border);display:flex;}
.tab-btn{flex:1;border:none;background:transparent;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;padding:7px 4px 6px;gap:2px;border-bottom:3px solid transparent;color:var(--muted);}
.tab-btn.active{color:var(--a1);border-bottom-color:var(--a1);}
.tab-icon{font-size:16px;}
.tab-label{font-size:10px;font-weight:700;}
.tab-badge{font-size:9px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;min-width:14px;text-align:center;}

/* 슬라이더 */
.pages-outer{overflow:hidden;}
.pages-slider{display:flex;width:700%;transition:transform .3s cubic-bezier(.4,0,.2,1);}
.page{width:14.285%;padding:10px 10px 80px;}

/* 요약 */
.big-card{background:linear-gradient(135deg,#E8F5EC,#EEF9F1);border:1px solid rgba(3,199,90,.22);border-radius:14px;padding:13px;margin-bottom:10px;position:relative;overflow:hidden;}
.big-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a4),var(--a6));}
.big-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
.bgn{text-align:center;}
.bgn-lbl{font-size:9px;color:var(--muted);font-weight:700;}
.bgn-val{font-size:22px;font-weight:900;letter-spacing:-1px;}

/* 마감 알림 */
.alert-card{background:rgba(46,204,113,.07);border:1.5px solid rgba(46,204,113,.25);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.alert-title{font-size:12px;font-weight:800;color:var(--a3);margin-bottom:8px;}
.alert-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(46,204,113,.1);}
.alert-item:last-child{border-bottom:none;}
.alert-floor{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;}
.alert-txt{font-size:11px;font-weight:700;flex:1;}
.alert-time{font-size:10px;color:var(--muted);}

/* 카드 공통 */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;}
.card-hdr{padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.card-body{padding:8px;}

/* 택배사 카드 */
.c-bar{width:4px;height:20px;border-radius:3px;flex-shrink:0;}
.c-name{font-size:13px;font-weight:800;flex:1;}
.c-total{text-align:right;}
.c-plt{font-size:16px;font-weight:900;}
.c-box{font-size:10px;color:var(--muted);}

/* 파레트 카드 (작은 버전) */
.plt-row{display:flex;align-items:flex-start;gap:7px;background:var(--card2);border-radius:8px;padding:7px 9px;margin-bottom:5px;}
.plt-row:last-child{margin-bottom:0;}
.pr-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.pr-info{flex:1;}
.pr-top{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.pr-no{background:var(--a5);color:#000;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:900;}
.pr-floor{font-size:9px;padding:1px 5px;border-radius:4px;color:#fff;}
.pr-box{font-size:12px;font-weight:900;color:var(--text);}
.pr-items{font-size:10px;color:var(--text);font-weight:600;line-height:1.6;}
.pr-item-box{color:var(--muted);font-size:9px;}

/* 층별 */
.floor-sec{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;}
.floor-sec-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--border);}
.floor-badge{padding:3px 10px;border-radius:7px;font-size:12px;font-weight:900;color:#fff;flex-shrink:0;}
.floor-total{margin-left:auto;font-size:11px;color:var(--muted);}
.done-chip{font-size:10px;font-weight:800;color:var(--a3);background:rgba(46,204,113,.12);border-radius:5px;padding:2px 7px;}
.floor-sec-body{padding:8px;}
.floor-c-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:6px;}
.fcc{background:var(--card2);border-radius:7px;padding:5px 6px;text-align:center;}
.fcc-name{font-size:9px;color:var(--muted);font-weight:700;}
.fcc-val{font-size:14px;font-weight:900;}
.fcc-box{font-size:9px;color:var(--muted);}

/* 제약사별 */
.pharma-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;}
.pharma-hdr{padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.pharma-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pharma-name{font-size:13px;font-weight:800;flex:1;}
.pharma-total{font-size:16px;font-weight:900;}
.pharma-body{padding:8px;}

/* 빈 상태 */
.empty{text-align:center;padding:36px 16px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:8px;}
</style>
</head>

<script>

function getTodayStr(){
  var d=new Date();
  var days=['일','월','화','수','목','금','토'];
  var month=d.getMonth()+1;
  var date=d.getDate();
  var day=days[d.getDay()];
  return month+'월 '+date+'일 ('+day+')';
}
var FB_URL = 'https://pallete-system-default-rtdb.asia-southeast1.firebasedatabase.app';
var ALL_FLOORS = ['B1','1F','3F','4F','5F'];
var FN = {'B1':'지하1층','1F':'1층','3F':'3층','4F':'4층','5F':'5층'};
var FNS = {'B1':'지하1','1F':'1층','3F':'3층','4F':'4층','5F':'5층'};
var FCOLORS = {'B1':'#3b9eff','1F':'#a78bfa','3F':'#f97316','4F':'#2ecc71','5F':'#ffd600'};
var PC = ['#3b9eff','#a78bfa','#f97316','#2ecc71','#ffd600','#ff6b9d','#06b6d4','#84cc16','#ef4444','#14b8a6','#ec4899','#8b5cf6','#f59e0b','#10b981','#6366f1','#78716c','#0ea5e9'];
var DC = [{id:'koryo',name:'고려택배',icon:'📦',color:'#3b9eff'},{id:'hanjin',name:'한진',icon:'🚚',color:'#a78bfa'},{id:'cj',name:'CJ',icon:'📫',color:'#f97316'},{id:'yongma',name:'용마',icon:'🏎',color:'#2ecc71'}];
var DP = ['구주제약','비씨월드제약','부광약품','대우제약','조아제약','동구바이오제약','삼천당제약','안국약품','한국파마','국제약품','아주약품','진양제약','매넬티제약','팜젠사이언스','경동제약','한국휴텍스제약','경동약품','에리슨제약'];

var waiting={}, doneStatus={}, notifications={};
var shipments={}, reports={};
var ELEVATORS={office:'사무 엘베', inbound:'입고 엘베'};
var ELEV_EMOJI={office:'🏢', inbound:'📥'};
var ELEV_COLOR={office:'#03C75A', inbound:'#2d6cdf'};
var cfg={couriers:DC, pharmas:DP};
var curTab=0, clockTimer=null;

var _mem={};
function lsGet(k){try{var v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}return _mem[k]||null;}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}_mem[k]=v;}

function loadCfgLocal(){
  var s=lsGet('plt_cfg');
  if(s){try{var c=JSON.parse(s);if(c.couriers&&c.couriers.length)cfg.couriers=c.couriers;if(c.pharmas&&c.pharmas.length)cfg.pharmas=c.pharmas;}catch(e){}}
}


function checkResetSignalAdmin(){
  fetch(FB_URL+'/reset_signal.json')
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.resetAt) return;
      var key='admin_last_reset';
      var last=lsGet(key);
      if(last===d.resetAt) return;
      lsSet(key,d.resetAt);
      if(d.date===getDayKeyAdmin()){
        // 관리자앱 데이터 초기화
        waiting={};doneStatus={};shipments={};reports={};notifications={};
        ALL_FLOORS.forEach(function(f){waiting[f]=[];});
        render();
        var el=document.getElementById('hdrSub');
        if(el) el.textContent='📅 일일마감 - 새 작업 시작됨';
      }
    }).catch(function(){});
}
function getDayKeyAdmin(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function init(){
  clockTimer=setInterval(function(){
    var n=new Date();
    var el=document.getElementById('hdrTime');
    if(el)el.textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
  },1000);
  loadData();
  setInterval(loadData,10000);
  setInterval(checkResetSignalAdmin,10000);
  checkResetSignalAdmin();
  checkAdminNewDay();
}

async function loadData(){
  loadCfgLocal();
  try{
    // reset_signal 감지
    try{
      var rs=await fetch(FB_URL+'/reset_signal.json');
      var sig=await rs.json();
      if(sig&&sig.resetAt){
        var lastReset=lsGet('plt_admin_last_reset');
        if(lastReset!==sig.resetAt){
          lsSet('plt_admin_last_reset',sig.resetAt);
          waiting={};doneStatus={};notifications={};shipments={};reports={};
          ALL_FLOORS.forEach(function(f){waiting[f]=[];});
          render();
          document.getElementById('hdrSub').textContent='🔄 초기화됨 · 새 작업 시작';
        }
      }
    }catch(e2){}
    var r=await fetch(FB_URL+'/waiting.json');
    var d=await r.json();
    if(d){if(d.data)waiting=d.data;if(d.doneStatus)doneStatus=d.doneStatus;}
    var r2=await fetch(FB_URL+'/notifications.json');
    var d2=await r2.json();
    if(d2)notifications=d2||{};
    // 출고완료 + 마감 보고서 (모니터와 동일 데이터)
    var r3=await fetch(FB_URL+'/shipments.json');
    var d3=await r3.json();
    shipments=d3||{};
    var r4=await fetch(FB_URL+'/reports.json');
    var d4=await r4.json();
    reports=d4||{};
    var now=new Date();
    document.getElementById('hdrSub').textContent=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0')+' 업데이트';
  }catch(e){
    var s=lsGet('plt_state');
    if(s){try{var pd=JSON.parse(s);waiting=pd.waiting||{};doneStatus=pd.doneStatus||{};}catch(e2){}}
    document.getElementById('hdrSub').textContent='로컬 데이터';
  }
  render();
}

function goTab(idx,btn){
  curTab=idx;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('slider').style.transform='translateX(-'+(idx*14.285)+'%)';;
  if(idx===5)renderPage5();
  if(idx===6)renderPage6();;
}

function sumAll(filterFloor,filterCourier){
  var plt=0,box=0;
  ALL_FLOORS.forEach(function(f){
    if(filterFloor&&f!==filterFloor)return;
    (waiting[f]||[]).forEach(function(p){
      if(filterCourier&&p.courierId!==filterCourier)return;
      plt++;box+=p.totalBox||0;
    });
  });
  return {plt:plt,box:box};
}

// 출고완료(shipments) 합계 — 모니터 KPI와 동일 기준
function sumShipped(filterFloor,filterCourier){
  var plt=0,box=0;
  Object.keys(shipments||{}).forEach(function(k){
    var e=shipments[k];
    if(!e||!e.pallets)return;
    if(filterFloor&&e.floor!==filterFloor)return;
    e.pallets.forEach(function(p){
      if(filterCourier&&p.courierId!==filterCourier)return;
      plt++;box+=p.totalBox||0;
    });
  });
  return {plt:plt,box:box};
}

function render(){
  renderPage0();
  renderPage1();
  renderPage2();
  renderPage3();
  renderPage4();
}

function renderPage5(){

      ALL_FLOORS.forEach(function(floor){
        var actByC={};

        (waiting[floor]||[]).forEach(function(p){if(actByC[p.courierId]!==undefined)actByC[p.courierId]++;});

        var floorExp=0, floorAct=0;
        DC.forEach(function(c){
          floorExp+=expectData2[floor+'_'+c.id]||0;
          floorAct+=actByC[c.id]||0;
        });

        var diff=floorAct-floorExp;
        var diffColor=diff>0?'var(--a3)':diff<0?'var(--red)':'var(--muted)';

            +(floorExp>0?'<div style="font-size:11px;color:var(--muted);">예상 <strong style="color:var(--a4);">'+floorExp+'</strong></div>':'')
            +'<div style="font-size:11px;color:var(--muted);">실제 <strong style="color:var(--a3);">'+floorAct+'</strong></div>'
            +(floorExp>0?'<div style="font-size:11px;font-weight:800;color:'+diffColor+';margin-left:auto;">'+(diff>=0?'+':'')+diff+' ('+pctF+'%)</div>':'')
          +'</div>'
          +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;">';
        DC.forEach(function(c){
          var exp=expectData2[floor+'_'+c.id]||0;
          var act=actByC[c.id]||0;

          html+='<div style="background:'+c.color+'15;border:1px solid '+c.color+'35;border-radius:7px;padding:5px;text-align:center;">'
            +'<div style="font-size:9px;font-weight:700;color:'+c.color+';">'+c.icon+' '+c.name+'</div>'

  if(!hasAny) html='<div class="empty"><div class="empty-icon">🏢</div>대기 중인 파레트가 없습니다</div>';
  document.getElementById('page2').innerHTML=html;
}

function renderPage3(){
  var html='';
  var hasAny=false;
  cfg.couriers.forEach(function(c){
    var allPallets=[];
    ALL_FLOORS.forEach(function(f){
      (waiting[f]||[]).forEach(function(p){if(p.courierId===c.id)allPallets.push(Object.assign({},p,{floor:f}));});
    });
    if(allPallets.length===0)return;
    hasAny=true;
    var totBox=allPallets.reduce(function(s,p){return s+p.totalBox;},0);
    html+='<div class="card">'
      +'<div class="card-hdr"><div class="c-bar" style="background:'+c.color+'"></div><div class="c-name">'+c.icon+' '+c.name+'</div>'
      +'<div class="c-total"><div class="c-plt" style="color:'+c.color+'">'+allPallets.length+'PLT</div><div class="c-box">'+totBox+'BOX</div></div></div>'
      +'<div class="card-body">';
    allPallets.sort(function(a,b){return ALL_FLOORS.indexOf(a.floor)-ALL_FLOORS.indexOf(b.floor)||a.pltNo-b.pltNo;}).forEach(function(p){
      html+='<div class="plt-row">'
        +'<div class="pr-dot" style="background:'+FCOLORS[p.floor]+'"></div>'
        +'<div class="pr-info">'
          +'<div class="pr-top"><div class="pr-no">No.'+p.pltNo+'</div><div class="pr-floor" style="background:'+FCOLORS[p.floor]+'">'+FNS[p.floor]+'</div></div>'
          +'<div class="pr-items">'+p.items.map(function(it){return it.pharma+'<span class="pr-item-box"> '+it.box+'박스</span>';}).join(' / ')+'</div>'
        +'</div>'
        +'<div style="text-align:right;flex-shrink:0;font-size:12px;font-weight:900;">'+p.totalBox+'BOX</div>'
      +'</div>';
    });
    html+='</div></div>';
  });
  if(!hasAny) html='<div class="empty"><div class="empty-icon">🚚</div>대기 중인 파레트가 없습니다</div>';
  document.getElementById('page3').innerHTML=html;
}

function renderPage4(){
  var html='';
  var pharmaMap={};
  ALL_FLOORS.forEach(function(f){
    (waiting[f]||[]).forEach(function(p){
      p.items.forEach(function(it){
        if(!pharmaMap[it.pharma])pharmaMap[it.pharma]={name:it.pharma,totalBox:0,pallets:[]};
        pharmaMap[it.pharma].totalBox+=it.box;
        pharmaMap[it.pharma].pallets.push({pltNo:p.pltNo,floor:f,courierId:p.courierId,courierColor:p.courierColor,box:it.box});
      });
    });
  });
  var pharmas=cfg.pharmas.filter(function(p){return pharmaMap[p];});
  if(pharmas.length===0){document.getElementById('page4').innerHTML='<div class="empty"><div class="empty-icon">💊</div>데이터가 없습니다</div>';return;}
  pharmas.forEach(function(pname,pi){
    var pm=pharmaMap[pname];
    var color=PC[pi%PC.length];
    html+='<div class="pharma-card">'
      +'<div class="pharma-hdr"><div class="pharma-dot" style="background:'+color+'"></div><div class="pharma-name">'+pname+'</div><div class="pharma-total" style="color:'+color+'">'+pm.totalBox+'<span style="font-size:10px;color:var(--muted)">BOX</span></div></div>'
      +'<div class="card-body">';
    pm.pallets.forEach(function(pl){
      var c=cfg.couriers.find(function(x){return x.id===pl.courierId;})||{color:pl.courierColor||'#555',icon:'📦',name:pl.courierId};
      html+='<div class="plt-row">'
        +'<div class="pr-dot" style="background:'+FCOLORS[pl.floor]+'"></div>'
        +'<div class="pr-info">'
          +'<div class="pr-top"><div class="pr-no">No.'+pl.pltNo+'</div><div class="pr-floor" style="background:'+FCOLORS[pl.floor]+'">'+FNS[pl.floor]+'</div><span style="font-size:9px;color:#fff;background:'+c.color+';border-radius:4px;padding:1px 5px;">'+c.icon+c.name+'</span></div>'
        +'</div>'
        +'<div style="font-size:12px;font-weight:900;flex-shrink:0;">'+pl.box+'박스</div>'
      +'</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('page4').innerHTML=html;
}

/* ── 초기화 (이중 확인 + 신호 전파) ── */
function manualResetAdmin(){
  if(!confirm('오늘 업무를 마감하고 새 작업을 시작할까요?\n\n현재 데이터가 보관됩니다.')) return;
  if(!confirm('⚠️ 실수 방지 재확인\n\n정말 전체 초기화할까요?\n모든 대기·출고·마감 데이터가 비워집니다.\n(모니터앱에서 복구 가능)')) return;
  adminDailyReset(false);
}

async function adminDailyReset(silent){
  var today=getDayKeyAdmin();
  try{
    var totalPlt=0,totalBox=0,byFloor={},byCourier={},allShipped=[];
    ALL_FLOORS.forEach(function(f){
      var wl=waiting[f]||[];
      var sl=[];Object.keys(shipments||{}).forEach(function(k){var e=shipments[k];if(e&&e.floor===f&&e.pallets){sl=sl.concat(e.pallets);allShipped=allShipped.concat(e.pallets.map(function(p){return Object.assign({},p,{floor:f});}));}});
      var all=wl.concat(sl);
      byFloor[f]={plt:all.length,box:all.reduce(function(s,p){return s+(p.totalBox||0);},0),done:doneStatus[f]||false};
      all.forEach(function(p){ if(!byCourier[p.courierId])byCourier[p.courierId]={plt:0,box:0}; byCourier[p.courierId].plt++; byCourier[p.courierId].box+=p.totalBox||0; totalPlt++; totalBox+=p.totalBox||0; });
    });
    var record={date:today,savedAt:new Date().toISOString(),totalPlt:totalPlt,totalBox:totalBox,byFloor:byFloor,byCourier:byCourier,pallets:allShipped};
    await fetch(FB_URL+'/history/'+today+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)});
    var empty={data:{},updatedAt:new Date().toISOString(),doneStatus:{}};
    ALL_FLOORS.forEach(function(f){empty.data[f]=[];});
    await Promise.all([
      fetch(FB_URL+'/waiting.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(empty)}),
      fetch(FB_URL+'/shipments.json',{method:'DELETE'}),
      fetch(FB_URL+'/notifications.json',{method:'DELETE'}),
      fetch(FB_URL+'/reports.json',{method:'DELETE'})
    ]);
    var resetAt=new Date().toISOString();
    await fetch(FB_URL+'/reset_signal.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:today,resetAt:resetAt,by:'관리자'})});
    lsSet('plt_admin_last_reset',resetAt); lsSet('admin_last_reset',resetAt); lsSet('plt_admin_last_day',today);
    waiting={};shipments={};doneStatus={};notifications={};reports={};
    ALL_FLOORS.forEach(function(f){waiting[f]=[];});
    render();
    if(!silent) alert('✅ '+today+' 마감 완료!\n데이터 보관됨\n전체 앱 새 작업 시작');
  }catch(e){ alert('오류: '+e.message); }
}

/* ── 날짜 변경 시 첫 실행 새 작업 확인 ── */
var _adminNewDayAsked=false;
function checkAdminNewDay(){
  var today=getDayKeyAdmin(), lastDay=lsGet('plt_admin_last_day');
  if(!lastDay){ lsSet('plt_admin_last_day',today); return; }
  if(lastDay!==today && !_adminNewDayAsked){
    _adminNewDayAsked=true; lsSet('plt_admin_last_day',today);
    if(confirm('📅 날짜가 바뀌었습니다.\n('+lastDay+' → '+today+')\n\n새로운 작업을 시작하시겠습니까?\n어제 데이터는 보관됩니다.')){
      if(confirm('⚠️ 실수 방지 재확인\n정말 전체 초기화할까요?')) adminDailyReset(false);
    }
  }
}
